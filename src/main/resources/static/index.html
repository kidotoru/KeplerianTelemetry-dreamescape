<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keplerian Telemetry — Earth View</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #3ddc84;
      font-family: "Courier New", monospace;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Three.js canvas container ── */
    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── UI overlay ── */
    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    header, #detail-panel { pointer-events: auto; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(30,48,80,0.8);
      background: rgba(10,14,26,0.85);
      backdrop-filter: blur(4px);
      flex-shrink: 0;
      gap: 12px;
    }

    header h1 {
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 0.15em;
      color: #7eb8f7;
      text-transform: uppercase;
    }

    #time-box {
      margin: 0 auto;
      border: 1px solid #1e3050;
      padding: 5px 18px;
      text-align: center;
    }

    #time-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #4a6a90;
      margin-bottom: 2px;
    }

    #current-time {
      font-size: 13px;
      color: #7eb8f7;
      letter-spacing: 0.05em;
    }

    #interval-box { display: flex; align-items: center; gap: 8px; }

    #interval-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a6a90;
    }

    #poll-interval {
      background: rgba(13,18,32,0.9);
      color: #c8d8f0;
      border: 1px solid #2a4060;
      border-radius: 3px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    #poll-interval:focus { outline: 1px solid #7eb8f7; }

    #status { font-size: 11px; color: #4a6a90; }
    #status.ok::before  { content: "● "; color: #3ddc84; }
    #status.err::before { content: "● "; color: #e05555; }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Right content area (transparent, passes clicks to canvas) ── */
    #content {
      flex: 1;
      padding: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      pointer-events: none;
    }

    /* ── Detail panel ── */
    #detail-panel {
      width: 260px;
      border: 1px solid rgba(30,48,80,0.8);
      background: rgba(8,12,20,0.92);
      backdrop-filter: blur(4px);
      padding: 16px 20px;
      display: none;
      pointer-events: auto;
    }

    #detail-name {
      font-size: 17px;
      color: #3ddc84;
      text-align: center;
      margin-bottom: 14px;
      letter-spacing: 0.1em;
    }

    .section-title {
      font-size: 11px;
      color: #3ddc84;
      letter-spacing: 0.08em;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 0;
    }

    .field-label { font-size: 11px; color: #2a7a50; letter-spacing: 0.04em; }
    .field-value { font-size: 11px; color: #3ddc84; font-variant-numeric: tabular-nums; margin-left: 8px; }

    /* ── 3D body labels (rendered by CSS2DRenderer) ── */
    .body-label {
      font-family: "Courier New", monospace;
      font-size: 11px;
      color: rgba(80,120,160,0.9);
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
      transform: translate(-50%, calc(-100% - 14px));
    }

    .body-label.lbl-selected { color: #3ddc84; }

    /* ── Body position markers (constant screen size) ── */
    .body-marker {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid rgba(85,136,187,0.75);
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
    }

    .body-marker.marker-selected { border-color: #3ddc84; border-width: 2px; }
  </style>
</head>
<body>

  <div id="canvas-wrap"></div>

  <div id="ui">
    <header>
      <h1>Keplerian Telemetry</h1>
      <div id="time-box">
        <div id="time-label">Current Time</div>
        <div id="current-time">—</div>
      </div>
      <div id="interval-box">
        <span id="interval-label">Interval</span>
        <select id="poll-interval">
          <option value="1000">1 sec</option>
          <option value="3000">3 sec</option>
          <option value="5000">5 sec</option>
          <option value="10000" selected>10 sec</option>
        </select>
      </div>
      <div id="status">Connecting…</div>
    </header>

    <div class="layout">
      <div id="content">
        <div id="detail-panel">
          <div id="detail-name"></div>
          <div class="section-title">Keplerian Elements</div>
          <div class="field-row"><span class="field-label">Epoch</span><span class="field-value" id="d-epoch">—</span></div>
          <div class="field-row"><span class="field-label">SMA</span><span class="field-value" id="d-sma">—</span></div>
          <div class="field-row"><span class="field-label">ECC</span><span class="field-value" id="d-ecc">—</span></div>
          <div class="field-row"><span class="field-label">INC  (°)</span><span class="field-value" id="d-inc">—</span></div>
          <div class="field-row"><span class="field-label">RAAN (°)</span><span class="field-value" id="d-raan">—</span></div>
          <div class="field-row"><span class="field-label">ARGP (°)</span><span class="field-value" id="d-argp">—</span></div>
          <div class="field-row"><span class="field-label">MA   (°)</span><span class="field-value" id="d-ma">—</span></div>
          <div class="section-title">Cartesian Elements (Earth-relative)</div>
          <div class="field-row"><span class="field-label">POS X</span><span class="field-value" id="d-px">—</span></div>
          <div class="field-row"><span class="field-label">POS Y</span><span class="field-value" id="d-py">—</span></div>
          <div class="field-row"><span class="field-label">POS Z</span><span class="field-value" id="d-pz">—</span></div>
          <div class="field-row"><span class="field-label">VEL X</span><span class="field-value" id="d-vx">—</span></div>
          <div class="field-row"><span class="field-label">VEL Y</span><span class="field-value" id="d-vy">—</span></div>
          <div class="field-row"><span class="field-label">VEL Z</span><span class="field-value" id="d-vz">—</span></div>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ── Constants ─────────────────────────────────────────────────────────────
    // Earth-centered view: 1 Three.js unit = 1000 km, so LEO/GEO orbits are
    // legible instead of collapsing into a point next to Earth (as they would
    // at the solar-system view's 1-unit-per-AU scale).
    const KM     = 1000;           // 1 km in meters
    const SCALE  = 1.0 / (1000 * KM); // Three.js units per meter (1 unit = 1000 km)
    const EARTH_RADIUS_FALLBACK = 6371000; // meters, used until telemetry arrives
    const EARTH_ID = 4; // Fixed object ID for Earth in the KSD object model
    const SUN_ID = 1; // Fixed object ID for the Sun in the KSD object model
    const HIDDEN_TYPES = new Set(['spacecenter']); // ground sites, not orbiting spacecraft
    const ORBIT_LINE_RADIUS = 0.00625; // Three.js units (≈6.25 km) — orbit tube thickness

    // ── Renderer setup ────────────────────────────────────────────────────────
    const container = document.getElementById('canvas-wrap');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x00000a, 1);
    container.appendChild(renderer.domElement);

    // CSS2D renderer for sharp text labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
    container.appendChild(labelRenderer.domElement);

    // ── Scene / Camera / Controls ─────────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.0005, 2000);
    camera.position.set(0, 14, 20);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance   = EARTH_RADIUS_FALLBACK * SCALE * 1.05;
    controls.maxDistance   = 500;

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ── Stars ─────────────────────────────────────────────────────────────────
    {
      const n   = 4000;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 600;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, sizeAttenuation: true })));
    }

    // ── Lighting ──────────────────────────────────────────────────────────────
    // Sunlight direction is updated every telemetry poll from the real Sun→Earth
    // vector (see updateSunLight()); positioned far away by an arbitrary amount
    // for now since only the direction to its target (Earth, at the origin)
    // matters for a directional light.
    const sunLight = new THREE.DirectionalLight(0xfff4e0, 2.5);
    sunLight.position.set(50, 0, 0);
    scene.add(sunLight, sunLight.target);
    // Dim fill so Earth's night side reads as "in shadow" rather than pure
    // black void, which would look like a rendering glitch on a booth monitor.
    scene.add(new THREE.AmbientLight(0x24344a, 0.6));

    // ── Scene groups ──────────────────────────────────────────────────────────
    const orbitGroup = new THREE.Group();
    const bodyGroup  = new THREE.Group();
    scene.add(orbitGroup, bodyGroup);

    function clearGroup(g) {
      g.traverse(child => {
        if (child.isCSS2DObject && child.element.parentNode) {
          child.element.parentNode.removeChild(child.element);
        }
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          (Array.isArray(child.material) ? child.material : [child.material]).forEach(m => m.dispose());
        }
      });
      while (g.children.length) g.remove(g.children[0]);
    }

    // ── Coordinate conversion: Unreal Engine → Three.js ─────────────────────
    // Unreal Engine: left-handed, Z-up (X=forward, Y=right, Z=up)
    // Step 1: negate Y to convert left-handed → right-handed (Z-up)
    // Step 2: Z-up → Y-up for Three.js:  (x, -y, z) → THREE(x, z, y)
    function toThree(x, y, z) {
      return new THREE.Vector3(x * SCALE, z * SCALE, y * SCALE);
    }

    // ── Orbit lines (sent by KSD as point arrays) ─────────────────────────────
    // orbitCache: id → { rev, legs }. Each leg's points are relative to its
    // parent body's pos (same axes as pos); KSD has already applied every frame
    // conversion (parent's axial tilt etc.), so the line is exactly the one KSD
    // itself draws and the marker always sits on it.
    const orbitCache = new Map();

    function storeOrbit(o) {
      if (o?.orbitRev != null && Array.isArray(o.orbitLegs)) {
        orbitCache.set(o.id, { rev: o.orbitRev, legs: o.orbitLegs });
      }
    }

    // Fetch orbit lines only for objects whose orbitRev changed since we last fetched them
    async function refreshOrbits(objects) {
      const stale = objects.filter(o => o.orbitRev != null && orbitCache.get(o.id)?.rev !== o.orbitRev);
      await Promise.all(stale.map(async o => {
        const res = await fetch(`/api/objects/${o.id}?orbits=true`);
        if (res.ok) storeOrbit(await res.json());
      }));
    }

    // Earth-relative Three.js point arrays (one per unbroken segment) for an object's orbit
    function orbitSegmentsEarthRelative(legs, ePos) {
      const out = [];
      legs.forEach(leg => {
        // Legs after an SOI change (e.g. into the Moon's) are relative to that body
        const parentPos = objectsById[leg.parentId]?.cart?.pos;
        if (!parentPos) return;
        const ox = parentPos.x - ePos.x, oy = parentPos.y - ePos.y, oz = parentPos.z - ePos.z;
        leg.segments.forEach(seg => {
          if (seg.length >= 2) out.push(seg.map(([x, y, z]) => toThree(x + ox, y + oy, z + oz)));
        });
      });
      return out;
    }

    // ── Earth mesh (persistent; only its radius changes as telemetry arrives) ─
    let earthMesh   = null;
    let earthRadius = EARTH_RADIUS_FALLBACK;

    // Reused every frame to test whether a marker/label sits behind Earth
    // from the camera's current viewpoint (see updateOcclusion() below).
    const occlusionSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), EARTH_RADIUS_FALLBACK * SCALE);
    const occlusionRay    = new THREE.Ray();
    const occlusionHit    = new THREE.Vector3();

    function ensureEarthMesh(radiusMeters) {
      const r = (radiusMeters != null && radiusMeters > 0) ? radiusMeters : EARTH_RADIUS_FALLBACK;
      occlusionSphere.radius = r * SCALE;
      if (earthMesh && r === earthRadius) return;
      earthRadius = r;

      if (earthMesh) {
        scene.remove(earthMesh);
        earthMesh.traverse(c => {
          if (c.geometry) c.geometry.dispose();
          if (c.material) c.material.dispose();
        });
      }

      const physRadius = r * SCALE;
      earthMesh = new THREE.Group();
      earthMesh.add(new THREE.Mesh(
        new THREE.SphereGeometry(physRadius, 32, 32),
        // Lit material (not MeshBasicMaterial) so sunLight actually shades it —
        // see updateSunLight() for how its direction is kept pointed at the Sun.
        new THREE.MeshPhongMaterial({ color: 0x2255aa, shininess: 15, specular: 0x223344 })
      ));
      earthMesh.userData.objectId = EARTH_MARKER_ID;
      scene.add(earthMesh);
    }

    // ── Sun direction ─────────────────────────────────────────────────────────
    // Earth is always drawn at the scene origin, so the light only needs to
    // point along the current real Sun→Earth direction; only sunObj/earthObj's
    // absolute (heliocentric) cart.pos are needed, same convention as the
    // Earth-relative spacecraft positions above.
    function updateSunLight(sunObj, ePos) {
      if (!sunObj?.cart?.pos || !ePos) return;
      const dir = toThree(
        sunObj.cart.pos.x - ePos.x,
        sunObj.cart.pos.y - ePos.y,
        sunObj.cart.pos.z - ePos.z
      ).normalize();
      sunLight.position.copy(dir.multiplyScalar(50));
    }

    // ── Scene update ──────────────────────────────────────────────────────────
    const EARTH_MARKER_ID = '__earth__';
    let craftMeshes = {};
    let occlusionTargets = []; // { pos: THREE.Vector3, markerObj, labelObj } — checked every frame

    function selectObject(id) {
      selectedId = id;
      focusOn(id);
      showDetail();
      updateScene();
    }

    function updateScene() {
      clearGroup(orbitGroup);
      clearGroup(bodyGroup);
      craftMeshes = {};
      occlusionTargets = [];

      if (!earthObj) return;

      ensureEarthMesh(earthObj.radius);

      const ePos = earthObj.cart?.pos;
      updateSunLight(sunObj, ePos);

      spacecraft.forEach(o => {
        const isSelected = o.id === selectedId;

        // ── Relative position marker ──
        if (o.cart?.pos && ePos) {
          const relX = o.cart.pos.x - ePos.x;
          const relY = o.cart.pos.y - ePos.y;
          const relZ = o.cart.pos.z - ePos.z;
          const pos3 = toThree(relX, relY, relZ);

          const physRadius = (o.radius != null && o.radius > 0) ? o.radius * SCALE : 0;
          const markerR = isSelected ? 0.6 : 0.4;
          const color = isSelected ? 0x3ddc84 : 0x5588bb;

          const craftObj = new THREE.Group();
          craftObj.position.copy(pos3);
          craftObj.userData.objectId = o.id;

          if (physRadius > 0) {
            craftObj.add(new THREE.Mesh(
              new THREE.SphereGeometry(physRadius, 8, 8),
              new THREE.MeshBasicMaterial({ color })
            ));
          }

          const hitSphere = new THREE.Mesh(
            new THREE.SphereGeometry(markerR, 8, 8),
            new THREE.MeshBasicMaterial({ visible: false })
          );
          craftObj.add(hitSphere);

          const markerWrapper = document.createElement('div');
          markerWrapper.style.pointerEvents = 'none';
          const markerDiv = document.createElement('div');
          markerDiv.className = 'body-marker' + (isSelected ? ' marker-selected' : '');
          markerDiv.addEventListener('click', e => { e.stopPropagation(); selectObject(o.id); });
          markerWrapper.appendChild(markerDiv);
          const markerObj = new CSS2DObject(markerWrapper);
          markerObj.position.set(0, 0, 0);
          craftObj.add(markerObj);

          const labelWrapper = document.createElement('div');
          labelWrapper.style.pointerEvents = 'none';
          const div = document.createElement('div');
          div.className = 'body-label' + (isSelected ? ' lbl-selected' : '');
          div.textContent = o.name ?? String(o.id);
          div.addEventListener('click', e => { e.stopPropagation(); selectObject(o.id); });
          labelWrapper.appendChild(div);
          const lbl = new CSS2DObject(labelWrapper);
          lbl.position.set(0, 0, 0);
          craftObj.add(lbl);

          bodyGroup.add(craftObj);
          craftMeshes[o.id] = craftObj;
          occlusionTargets.push({ pos: pos3.clone(), markerObj, labelObj: lbl });
        }

        // ── Orbit line (point arrays from KSD) ──
        const orbit = orbitCache.get(o.id);
        if (orbit && ePos) {
          orbitSegmentsEarthRelative(orbit.legs, ePos).forEach(pts => {
            // A plain THREE.Line's width is capped at 1px on most GPU/driver
            // combos (WebGL never reliably honors LineBasicMaterial.linewidth),
            // so draw the orbit as a thin tube instead — this is the
            // only approach that reliably renders as a visibly thick line
            // across platforms, which matters for an exhibition display.
            // Segments are open polylines (a closed ellipse repeats its first point at the end).
            const curve    = new THREE.CatmullRomCurve3(pts, false);
            const tubeGeo  = new THREE.TubeGeometry(curve, pts.length, isSelected ? ORBIT_LINE_RADIUS * 1.5 : ORBIT_LINE_RADIUS, 6, false);
            orbitGroup.add(new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({
              color:       isSelected ? 0x3ddc84 : 0x999999,
              transparent: true,
              opacity:     isSelected ? 0.9 : 0.6
            })));
          });
        }
      });
    }

    // ── Raycasting: click on body sphere ──────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    let pointerDownPos = null;

    renderer.domElement.addEventListener('pointerdown', e => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('click', e => {
      if (!pointerDownPos) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      if (dx * dx + dy * dy > 25) return; // ignore drag (> 5px)

      const rect  = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      raycaster.setFromCamera(mouse, camera);

      const hitTargets = [...bodyGroup.children];
      if (earthMesh) hitTargets.push(earthMesh);
      const hits = raycaster.intersectObjects(hitTargets, true);
      if (hits.length > 0) {
        let node = hits[0].object;
        while (node && node.userData.objectId == null) node = node.parent;
        const id = node?.userData.objectId;
        if (id != null) selectObject(id);
      }
    });

    // ── Focus animation ───────────────────────────────────────────────────────
    let targetGoal = null;

    function focusOn(id) {
      if (id === EARTH_MARKER_ID) {
        targetGoal = new THREE.Vector3(0, 0, 0);
        controls.minDistance = earthRadius * SCALE * 1.05;
        return;
      }
      const obj = spacecraft.find(o => o.id === id);
      const ePos = earthObj?.cart?.pos;
      if (!obj?.cart?.pos || !ePos) return;
      targetGoal = toThree(obj.cart.pos.x - ePos.x, obj.cart.pos.y - ePos.y, obj.cart.pos.z - ePos.z);
      controls.minDistance = (obj.radius != null && obj.radius > 0)
        ? obj.radius * 2 * SCALE
        : 0.02;
    }

    // ── Occlusion ──────────────────────────────────────────────────────────────
    // CSS2DRenderer draws marker/label DOM elements as a plain screen-space
    // overlay — it has no idea Earth's mesh is in front of them, so without
    // this they'd float visibly "through" Earth. Ray-test each one against
    // Earth's sphere every frame (camera moves continuously via OrbitControls
    // even between telemetry polls) and hide the ones on the far side.
    //
    // Important: this must set CSS2DObject.visible, NOT style.display on the
    // wrapper directly — CSS2DRenderer.render() unconditionally overwrites
    // style.display from object.visible on every single frame, so poking the
    // DOM style here would just get clobbered by the very next
    // labelRenderer.render() call in animate().
    function updateOcclusion() {
      const camPos = camera.position;
      for (const t of occlusionTargets) {
        const toTarget  = t.pos.clone().sub(camPos);
        const distToObj = toTarget.length();
        occlusionRay.origin.copy(camPos);
        occlusionRay.direction.copy(toTarget).divideScalar(distToObj || 1);
        const hit    = occlusionRay.intersectSphere(occlusionSphere, occlusionHit);
        const hidden = !!hit && occlusionHit.distanceTo(camPos) < distToObj - 1e-6;
        t.markerObj.visible = !hidden;
        t.labelObj.visible  = !hidden;
      }
    }

    // ── Animation loop ────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      if (targetGoal) {
        controls.target.lerp(targetGoal, 0.08);
        if (controls.target.distanceTo(targetGoal) < 0.0001) {
          controls.target.copy(targetGoal);
          targetGoal = null;
        }
      }
      controls.update();
      updateOcclusion();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();

    // ── UI logic ──────────────────────────────────────────────────────────────
    const statusEl       = document.getElementById("status");
    const currentTimeEl  = document.getElementById("current-time");
    const pollIntervalEl = document.getElementById("poll-interval");
    const detailPanelEl  = document.getElementById("detail-panel");

    let timerId    = null;
    let objectsById = {};    // all objects by id (orbit legs may be relative to non-Earth parents)
    let earthObj   = null;   // the Earth SpaceObject, or null until telemetry arrives
    let sunObj     = null;   // the Sun SpaceObject, used only to aim sunLight
    let spacecraft = [];     // objects whose parentId === earthObj.id
    let selectedId = null;   // number (spacecraft id) or EARTH_MARKER_ID

    function fmtNum(n, d) { return n == null ? "—" : Number(n).toFixed(d); }
    function fmtEpoch(ep) {
      if (ep == null) return "—";
      return new Date(ep * 1000).toISOString().replace("T", " ").slice(0, 19);
    }

    function showDetail() {
      if (selectedId === EARTH_MARKER_ID && earthObj) {
        detailPanelEl.style.display = "block";
        document.getElementById("detail-name").textContent = "EARTH";
        document.getElementById("d-epoch").textContent = fmtEpoch(earthObj.kep?.ep);
        document.getElementById("d-sma").textContent   = fmtNum(earthObj.kep?.a,    3);
        document.getElementById("d-ecc").textContent   = fmtNum(earthObj.kep?.e,    7);
        document.getElementById("d-inc").textContent   = fmtNum(earthObj.kep?.i,    4);
        document.getElementById("d-raan").textContent  = fmtNum(earthObj.kep?.raan, 2);
        document.getElementById("d-argp").textContent  = fmtNum(earthObj.kep?.argp, 2);
        document.getElementById("d-ma").textContent    = fmtNum(earthObj.kep?.ma,   2);
        document.getElementById("d-px").textContent    = fmtNum(0, 3);
        document.getElementById("d-py").textContent    = fmtNum(0, 3);
        document.getElementById("d-pz").textContent    = fmtNum(0, 3);
        document.getElementById("d-vx").textContent    = "—";
        document.getElementById("d-vy").textContent    = "—";
        document.getElementById("d-vz").textContent    = "—";
        return;
      }

      const obj = spacecraft.find(o => o.id === selectedId);
      if (!obj) { detailPanelEl.style.display = "none"; return; }
      const ePos = earthObj?.cart?.pos;
      detailPanelEl.style.display = "block";
      document.getElementById("detail-name").textContent = obj.name ?? obj.id;
      document.getElementById("d-epoch").textContent = fmtEpoch(obj.kep?.ep);
      document.getElementById("d-sma").textContent   = fmtNum(obj.kep?.a,    3);
      document.getElementById("d-ecc").textContent   = fmtNum(obj.kep?.e,    7);
      document.getElementById("d-inc").textContent   = fmtNum(obj.kep?.i,    4);
      document.getElementById("d-raan").textContent  = fmtNum(obj.kep?.raan, 2);
      document.getElementById("d-argp").textContent  = fmtNum(obj.kep?.argp, 2);
      document.getElementById("d-ma").textContent    = fmtNum(obj.kep?.ma,   2);
      document.getElementById("d-px").textContent    = fmtNum(obj.cart?.pos && ePos ? obj.cart.pos.x - ePos.x : null, 3);
      document.getElementById("d-py").textContent    = fmtNum(obj.cart?.pos && ePos ? obj.cart.pos.y - ePos.y : null, 3);
      document.getElementById("d-pz").textContent    = fmtNum(obj.cart?.pos && ePos ? obj.cart.pos.z - ePos.z : null, 3);
      document.getElementById("d-vx").textContent    = fmtNum(obj.cart?.vel?.x, 9);
      document.getElementById("d-vy").textContent    = fmtNum(obj.cart?.vel?.y, 9);
      document.getElementById("d-vz").textContent    = fmtNum(obj.cart?.vel?.z, 9);
    }

    function render(data) {
      const objects = (data.objects ?? []).slice().sort((a, b) => a.id - b.id);
      if (data.currentTime != null) {
        currentTimeEl.textContent = new Date(data.currentTime * 1000)
          .toISOString().replace("T", " ").slice(0, 19) + " UTC";
      }

      objectsById = Object.fromEntries(objects.map(o => [o.id, o]));
      earthObj = objects.find(o => o.id === EARTH_ID) ?? null;
      sunObj   = objects.find(o => o.id === SUN_ID) ?? null;
      spacecraft = earthObj
        ? objects.filter(o => o.parentId === earthObj.id && !HIDDEN_TYPES.has((o.type ?? "").trim().toLowerCase()))
        : [];

      if (earthObj && selectedId == null) selectedId = EARTH_MARKER_ID;
      if (selectedId !== EARTH_MARKER_ID && !spacecraft.some(o => o.id === selectedId)) {
        selectedId = earthObj ? EARTH_MARKER_ID : null;
      }

      showDetail();
      updateScene();
    }

    async function poll() {
      try {
        const res  = await fetch("/api/objects");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        await refreshOrbits(data.objects ?? []);
        render(data);
        statusEl.className   = "ok";
        statusEl.textContent = earthObj ? "Live" : "Live (waiting for Earth)";
      } catch (e) {
        statusEl.className   = "err";
        statusEl.textContent = e.message;
      }
    }

    function startPolling() {
      if (timerId !== null) clearInterval(timerId);
      timerId = setInterval(poll, Number(pollIntervalEl.value));
    }

    pollIntervalEl.addEventListener("change", startPolling);

    poll();
    startPolling();
  </script>
</body>
</html>
