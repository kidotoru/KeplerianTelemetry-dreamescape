<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keplerian Telemetry — Earth View</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #3ddc84;
      font-family: "Courier New", monospace;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Three.js canvas container ── */
    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    :root {
      --chart-width: min(42vw, 680px);
      --bottom-panel-height: calc(var(--chart-width) * 3 / 5); /* the chart is 5:3 */
      --panel-gap: 12px;
      --panel-bg: rgba(28, 44, 68, 0.4);      /* shared by every panel */
      --panel-border: rgba(60, 90, 130, 0.5);
    }

    /* ── Data feed (bottom centre, between the chart and the ground track map) ──
       Fixed height like its neighbours; the width takes whatever is left between them. */
    #data-feed {
      position: fixed;
      bottom: var(--panel-gap);
      left: calc(var(--panel-gap) * 2 + var(--chart-width));                /* right of the chart */
      right: calc(var(--panel-gap) * 2 + var(--bottom-panel-height) * 2);   /* left of the map */
      height: var(--bottom-panel-height);
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      padding: 10px 14px;
      overflow: hidden;
      z-index: 11;
      pointer-events: none;
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 16px;          /* must match DATA_FEED_LINE_HEIGHT */
      color: rgba(255, 255, 255, 0.75);
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
    }

    #data-feed-text { will-change: transform; }

    /* ── Mission clock + event log (top left) and ground track map (bottom right) ── */
    #mission-panel, #ground-track {
      position: fixed;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      z-index: 11;
      pointer-events: none;
      font-family: "Courier New", monospace;
      color: #ffffff;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
    }
    #mission-panel {
      top: var(--panel-gap);
      left: var(--panel-gap);
      width: var(--chart-width);
      bottom: calc(var(--panel-gap) * 3 + var(--bottom-panel-height) * 2);  /* above the left-middle panel; the height takes what is left */
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
    }
    #ground-track {
      bottom: var(--panel-gap);
      right: var(--panel-gap);
      height: var(--bottom-panel-height);   /* same height as the chart */
      width: calc(var(--bottom-panel-height) * 2); /* 2:1, so the map fills the panel */
    }
    /* ── Orbit chart (left middle): same fixed size as the flight chart, directly above it ── */
    #orbit-chart {
      position: fixed;
      left: var(--panel-gap);
      bottom: calc(var(--panel-gap) * 2 + var(--bottom-panel-height));
      width: var(--chart-width);
      height: var(--bottom-panel-height);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      z-index: 11;
      pointer-events: none;
    }

    #orbit-chart canvas { width: 100%; height: 100%; display: block; }

    #ground-track canvas { width: 100%; height: 100%; display: block; }

    .mission-caption { font-size: 12px; letter-spacing: 0.12em; color: rgba(255, 255, 255, 0.6); }
    #met { font-size: 44px; letter-spacing: 0.06em; margin: 2px 0 8px; font-variant-numeric: tabular-nums; }
    #event-log {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* filled from the top, one row per event */
      border-top: 1px solid var(--panel-border);
      padding-top: 6px;
    }
    .event-row {
      display: grid;
      grid-template-columns: 12ch 20ch 16ch 16ch; /* time | event | "ALT  12345.6 km" | "VEL 12.34 km/s" */
      column-gap: 1ch;
      font-size: 15px;
      line-height: 22px;
      white-space: pre;
    }
    .event-row .ev-name { color: #7fcf9c; }
    .event-row .ev-num { color: rgba(255, 255, 255, 0.8); }
    .event-row.ev-new { animation: ev-flash 2.5s ease-out; }
    @keyframes ev-flash {
      from { background: rgba(127, 207, 156, 0.45); }
      to   { background: transparent; }
    }

    /* One row per object. Fixed column widths keep the columns aligned on every row
       (full-width characters in names don't render exactly 2 half-width columns wide,
       so padding with spaces alone wouldn't line up). */
    .feed-row {
      display: grid;
      grid-template-columns: 30ch 20ch 16ch 16ch; /* name | "VEL X=" + 10 + " m/s" | "Y=" + 10 + " m/s" | "Z=" ... */
      column-gap: 1ch;
      height: 16px;               /* exactly one line, so chunks stay a whole number of lines */
      white-space: pre;
      overflow: hidden;
    }
    .feed-row > span { overflow: hidden; }


    /* ── Flight chart (selected spacecraft: surface speed / altitude vs time) ── */
    #flight-chart {
      position: fixed;
      bottom: 12px;
      left: 12px;
      width: var(--chart-width);
      height: var(--bottom-panel-height);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      pointer-events: none;
      z-index: 11;
    }

    #flight-chart canvas { width: 100%; height: 100%; display: block; }

    /* ── 3D body labels (rendered by CSS2DRenderer) ── */
    .body-label {
      font-family: "Courier New", monospace;
      font-size: 11px;
      color: rgba(80,120,160,0.9);
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
      /* CSS2DRenderer already centers the wrapper on the point; only lift the label above the marker */
      transform: translateY(calc(-100% - 6px));
    }

    .body-label.lbl-selected { color: #3ddc84; font-size: 14px; font-weight: bold; }

    /* ── Body position markers (constant screen size) ──
       No transform here: CSS2DRenderer already centers the wrapper (and so this circle) on the point */
    .body-marker {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(85,136,187,0.9);
      pointer-events: auto;
      cursor: pointer;
      box-sizing: border-box;
    }

    .body-marker.marker-selected { width: 14px; height: 14px; background: #3ddc84; }
  </style>
</head>
<body>

  <div id="canvas-wrap"></div>

  <div id="flight-chart"><canvas id="flight-chart-canvas"></canvas></div>

  <div id="orbit-chart"><canvas id="orbit-chart-canvas"></canvas></div>

  <div id="data-feed"><div id="data-feed-text"></div></div>

  <div id="mission-panel">
    <div class="mission-caption" id="mission-caption">MISSION ELAPSED TIME</div>
    <div id="met">T+ 00:00:00</div>
    <div class="mission-caption">FLIGHT EVENTS</div>
    <div id="event-log"></div>
  </div>

  <div id="ground-track"><canvas id="ground-track-canvas"></canvas></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ── Constants ─────────────────────────────────────────────────────────────
    // Earth-centered view: 1 Three.js unit = 1000 km, so LEO/GEO orbits are
    // legible instead of collapsing into a point next to Earth (as they would
    // at the solar-system view's 1-unit-per-AU scale).
    const KM     = 1000;           // 1 km in meters
    const SCALE  = 1.0 / (1000 * KM); // Three.js units per meter (1 unit = 1000 km)
    const EARTH_RADIUS_FALLBACK = 6371000; // meters, used until telemetry arrives
    const EARTH_ID = 4; // Fixed object ID for Earth in the KSD object model
    const SUN_ID = 1; // Fixed object ID for the Sun in the KSD object model
    const HIDDEN_TYPES = new Set(['spacecenter']); // ground sites, not orbiting spacecraft

    // ── Renderer setup ────────────────────────────────────────────────────────
    const container = document.getElementById('canvas-wrap');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x00000a, 1);
    container.appendChild(renderer.domElement);

    // CSS2D renderer for sharp text labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
    container.appendChild(labelRenderer.domElement);

    // ── Scene / Camera / Controls ─────────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.0005, 2000);
    camera.position.set(0, 14, 20);
    camera.lookAt(0, 0, 0);

    function createControls() {
      const c = new OrbitControls(camera, renderer.domElement);
      c.enableDamping = true;
      c.dampingFactor = 0.06;
      c.minDistance   = EARTH_RADIUS_FALLBACK * SCALE * 1.05;
      c.maxDistance   = 500;
      return c;
    }
    let controls = createControls();
    const SCENE_UP = new THREE.Vector3(0, 1, 0);

    // Which way is "up" on screen (the axis the viewer orbits around). OrbitControls
    // bakes camera.up in when it's constructed, so changing it means rebuilding the controls.
    function setCameraUp(up) {
      if (camera.up.distanceTo(up) < 1e-6) return;
      rebuildControls(up);
    }

    function rebuildControls(up) {
      const target = controls.target.clone();
      const minDistance = controls.minDistance;
      controls.dispose();
      camera.up.copy(up);
      controls = createControls();
      controls.target.copy(target);
      controls.minDistance = minDistance;
    }

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ── Stars ─────────────────────────────────────────────────────────────────
    {
      const n   = 4000;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 600;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, sizeAttenuation: true })));
    }

    // ── Lighting ──────────────────────────────────────────────────────────────
    // Sunlight direction is updated every telemetry poll from the real Sun→Earth
    // vector (see updateSunLight()); positioned far away by an arbitrary amount
    // for now since only the direction to its target (Earth, at the origin)
    // matters for a directional light.
    const sunLight = new THREE.DirectionalLight(0xfff4e0, 2.5);
    sunLight.position.set(50, 0, 0);
    scene.add(sunLight, sunLight.target);
    // Dim fill so Earth's night side reads as "in shadow" rather than pure
    // black void, which would look like a rendering glitch on a booth monitor.
    scene.add(new THREE.AmbientLight(0x24344a, 0.6));

    // ── Scene groups ──────────────────────────────────────────────────────────
    const orbitGroup = new THREE.Group();
    const bodyGroup  = new THREE.Group();
    scene.add(orbitGroup, bodyGroup);

    function clearGroup(g) {
      g.traverse(child => {
        if (child.isCSS2DObject && child.element.parentNode) {
          child.element.parentNode.removeChild(child.element);
        }
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          (Array.isArray(child.material) ? child.material : [child.material]).forEach(m => m.dispose());
        }
      });
      while (g.children.length) g.remove(g.children[0]);
    }

    // ── Coordinate conversion: Unreal Engine → Three.js ─────────────────────
    // Unreal Engine: left-handed, Z-up (X=forward, Y=right, Z=up)
    // Step 1: negate Y to convert left-handed → right-handed (Z-up)
    // Step 2: Z-up → Y-up for Three.js:  (x, -y, z) → THREE(x, z, y)
    function toThree(x, y, z) {
      return new THREE.Vector3(x * SCALE, z * SCALE, y * SCALE);
    }

    // ── Orbit lines (sent by KSD as point arrays) ─────────────────────────────
    // orbitCache: id → { rev, legs }. Each leg's points are relative to its
    // parent body's pos (same axes as pos); KSD has already applied every frame
    // conversion (parent's axial tilt etc.), so the line is exactly the one KSD
    // itself draws and the marker always sits on it.
    const orbitCache = new Map();

    function storeOrbit(o) {
      if (o?.orbitRev != null && Array.isArray(o.orbitLegs)) {
        orbitCache.set(o.id, { rev: o.orbitRev, legs: o.orbitLegs });
      }
    }

    // Fetch orbit lines only for objects whose orbitRev changed since we last fetched them
    async function refreshOrbits(objects) {
      const stale = objects.filter(o => o.orbitRev != null && orbitCache.get(o.id)?.rev !== o.orbitRev);
      await Promise.all(stale.map(async o => {
        const res = await fetch(`/api/objects/${o.id}?orbits=true`);
        if (res.ok) storeOrbit(await res.json());
      }));
    }

    // Earth-relative Three.js point arrays (one per unbroken segment) for an object's orbit
    function orbitSegmentsEarthRelative(legs, ePos) {
      const out = [];
      legs.forEach(leg => {
        // Legs after an SOI change (e.g. into the Moon's) are relative to that body
        const parentPos = objectsById[leg.parentId]?.cart?.pos;
        if (!parentPos) return;
        const ox = parentPos.x - ePos.x, oy = parentPos.y - ePos.y, oz = parentPos.z - ePos.z;
        leg.segments.forEach(seg => {
          if (seg.length >= 2) out.push(seg.map(([x, y, z]) => toThree(x + ox, y + oy, z + oz)));
        });
      });
      return out;
    }

    // ── Earth mesh (persistent; only its radius changes as telemetry arrives) ─
    let earthMesh   = null;
    let earthRadius = EARTH_RADIUS_FALLBACK;

    // Reused every frame to test whether a marker/label sits behind Earth
    // from the camera's current viewpoint (see updateOcclusion() below).
    const occlusionSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), EARTH_RADIUS_FALLBACK * SCALE);
    const occlusionRay    = new THREE.Ray();
    const occlusionHit    = new THREE.Vector3();

    // Equirectangular (2:1) Earth texture. Loaded once and shared by every Earth
    // mesh rebuild. The globe is oriented to KSD's Earth by orientGlobe().
    const earthTexture = new THREE.TextureLoader().load('img/T_Earth_Map.png');
    earthTexture.colorSpace = THREE.SRGBColorSpace;
    earthTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    function ensureEarthMesh(radiusMeters) {
      const r = (radiusMeters != null && radiusMeters > 0) ? radiusMeters : EARTH_RADIUS_FALLBACK;
      occlusionSphere.radius = r * SCALE;
      if (earthMesh && r === earthRadius) return;
      earthRadius = r;

      if (earthMesh) {
        scene.remove(earthMesh);
        earthMesh.traverse(c => {
          if (c.geometry) c.geometry.dispose();
          if (c.material) c.material.dispose();
        });
      }

      const physRadius = r * SCALE;
      earthMesh = new THREE.Group();
      earthMesh.add(new THREE.Mesh(
        new THREE.SphereGeometry(physRadius, 64, 64),
        // Lit material (not MeshBasicMaterial) so sunLight actually shades it —
        // see updateSunLight() for how its direction is kept pointed at the Sun.
        new THREE.MeshPhongMaterial({ map: earthTexture, shininess: 15, specular: 0x223344 })
      ));
      earthMesh.userData.objectId = EARTH_MARKER_ID;
      scene.add(earthMesh);
    }

    // ── Globe orientation (axial tilt + rotation angle from KSD) ──────────────
    // KSD sends each body's north pole, (lat 0, lon 0) and (lat 0, lon 90°E)
    // directions as unit vectors in the same axes as pos. THREE.SphereGeometry's
    // UVs put an equirectangular map's lon 0 at local +X, the north pole at +Y
    // and lon 90°E at -Z, so those three directions are exactly the mesh's basis.
    const globeBasis = new THREE.Matrix4();
    let warnedMirroredGlobe = false;

    function dirToThree(v) {
      return new THREE.Vector3(v.x, v.z, v.y); // same axis mapping as toThree(), without scaling
    }

    function orientGlobe(mesh, orientation) {
      if (!mesh || !orientation?.north || !orientation?.primeMeridian || !orientation?.east) return;
      const prime = dirToThree(orientation.primeMeridian).normalize();
      const north = dirToThree(orientation.north).normalize();
      const east  = dirToThree(orientation.east).normalize();
      globeBasis.makeBasis(prime, north, east.negate());
      if (globeBasis.determinant() < 0) {
        // Would mean the map comes out mirrored; a rotation can't represent that
        if (!warnedMirroredGlobe) console.warn('[earth] orientation basis is mirrored; leaving the globe unrotated');
        warnedMirroredGlobe = true;
        return;
      }
      mesh.quaternion.setFromRotationMatrix(globeBasis);
    }

    // ── Sun direction ─────────────────────────────────────────────────────────
    // Earth is always drawn at the scene origin, so the light only needs to
    // point along the current real Sun→Earth direction; only sunObj/earthObj's
    // absolute (heliocentric) cart.pos are needed, same convention as the
    // Earth-relative spacecraft positions above.
    function updateSunLight(sunObj, ePos) {
      if (!sunObj?.cart?.pos || !ePos) return;
      const dir = toThree(
        sunObj.cart.pos.x - ePos.x,
        sunObj.cart.pos.y - ePos.y,
        sunObj.cart.pos.z - ePos.z
      ).normalize();
      sunLight.position.copy(dir.multiplyScalar(50));
    }

    // ── Scene update ──────────────────────────────────────────────────────────
    const EARTH_MARKER_ID = '__earth__';
    let craftMeshes = {};
    let occlusionTargets = []; // { pos: THREE.Vector3, markerObj, labelObj } — checked every frame

    function selectObject(id) {
      selectedId = id;
      focusOn(id);
      updateScene();
    }

    function updateScene() {
      clearGroup(orbitGroup);
      clearGroup(bodyGroup);
      craftMeshes = {};
      occlusionTargets = [];

      if (!earthObj) return;

      ensureEarthMesh(earthObj.radius);
      orientGlobe(earthMesh, earthObj.orientation);

      const ePos = earthObj.cart?.pos;
      updateSunLight(sunObj, ePos);

      spacecraft.forEach(o => {
        const isSelected = o.id === selectedId;

        // ── Relative position marker ──
        if (o.cart?.pos && ePos) {
          const relX = o.cart.pos.x - ePos.x;
          const relY = o.cart.pos.y - ePos.y;
          const relZ = o.cart.pos.z - ePos.z;
          const pos3 = toThree(relX, relY, relZ);

          const physRadius = (o.radius != null && o.radius > 0) ? o.radius * SCALE : 0;
          const markerR = isSelected ? 0.6 : 0.4;
          const color = isSelected ? 0x3ddc84 : 0x5588bb;

          const craftObj = new THREE.Group();
          craftObj.position.copy(pos3);
          craftObj.userData.objectId = o.id;

          if (physRadius > 0) {
            craftObj.add(new THREE.Mesh(
              new THREE.SphereGeometry(physRadius, 8, 8),
              new THREE.MeshBasicMaterial({ color })
            ));
          }

          const hitSphere = new THREE.Mesh(
            new THREE.SphereGeometry(markerR, 8, 8),
            new THREE.MeshBasicMaterial({ visible: false })
          );
          craftObj.add(hitSphere);

          const markerWrapper = document.createElement('div');
          markerWrapper.style.pointerEvents = 'none';
          const markerDiv = document.createElement('div');
          markerDiv.className = 'body-marker' + (isSelected ? ' marker-selected' : '');
          markerDiv.addEventListener('click', e => { e.stopPropagation(); selectObject(o.id); });
          markerWrapper.appendChild(markerDiv);
          const markerObj = new CSS2DObject(markerWrapper);
          markerObj.position.set(0, 0, 0);
          craftObj.add(markerObj);

          const labelWrapper = document.createElement('div');
          labelWrapper.style.pointerEvents = 'none';
          const div = document.createElement('div');
          div.className = 'body-label' + (isSelected ? ' lbl-selected' : '');
          div.textContent = o.name ?? String(o.id);
          div.addEventListener('click', e => { e.stopPropagation(); selectObject(o.id); });
          labelWrapper.appendChild(div);
          const lbl = new CSS2DObject(labelWrapper);
          lbl.position.set(0, 0, 0);
          craftObj.add(lbl);

          bodyGroup.add(craftObj);
          craftMeshes[o.id] = craftObj;
          occlusionTargets.push({ pos: pos3.clone(), markerObj, labelObj: lbl });
        }

        // ── Orbit line (point arrays from KSD) ──
        const orbit = orbitCache.get(o.id);
        if (orbit && ePos) {
          const material = new THREE.LineBasicMaterial({
            color:       isSelected ? 0x3ddc84 : 0x999999,
            transparent: true,
            opacity:     isSelected ? 0.9 : 0.6
          });
          // Segments are open polylines (a closed ellipse repeats its first point at the end)
          orbitSegmentsEarthRelative(orbit.legs, ePos).forEach(pts => {
            orbitGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), material));
          });
        }
      });

      drawPastTrack(ePos);
    }

    // ── Past track of the spacecraft selected in KSD ─────────────────────────
    // Only before orbit insertion (launch / ballistic flight), like KSD's own
    // actual-trajectory line. The server records each point in its parent body's
    // fixed frame (components along primeMeridian / east / north), so drawing it
    // with the body's *current* orientation keeps it glued to the ground (launch
    // pad included) while the Earth rotates.
    const TRACK_COLOR = 0xffc04d;
    let lastTrack = null;

    function drawPastTrack(ePos) {
      const samples = lastTrack?.samples ?? [];
      if (!ePos || samples.length < 2) return;
      const material = new THREE.LineBasicMaterial({ color: TRACK_COLOR, transparent: true, opacity: 0.95 });

      // One polyline per run of samples with the same parent body
      let run = [];
      const flush = () => {
        if (run.length >= 2) {
          orbitGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(run), material));
        }
        run = [];
      };
      let runParentId = null;
      samples.forEach(p => {
        if (p.parentId !== runParentId) { flush(); runParentId = p.parentId; }
        const parent = objectsById[p.parentId];
        const pp = parent?.cart?.pos, o = parent?.orientation;
        if (!pp || !o?.primeMeridian || !o?.east || !o?.north) return;
        const f = p.fixed;
        // Body-fixed components → world (same axes as pos) with the body's current orientation
        const x = pp.x - ePos.x + f.x * o.primeMeridian.x + f.y * o.east.x + f.z * o.north.x;
        const y = pp.y - ePos.y + f.x * o.primeMeridian.y + f.y * o.east.y + f.z * o.north.y;
        const z = pp.z - ePos.z + f.x * o.primeMeridian.z + f.y * o.east.z + f.z * o.north.z;
        run.push(toThree(x, y, z));
      });
      flush();
    }

    async function fetchTrack() {
      try {
        const res = await fetch("/api/track");
        if (res.ok) lastTrack = await res.json();
      } catch (e) {
        console.warn(`[track] ${e.message}`);
      }
    }

    // ── Raycasting: click on body sphere ──────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    let pointerDownPos = null;

    renderer.domElement.addEventListener('pointerdown', e => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('click', e => {
      if (!pointerDownPos) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      if (dx * dx + dy * dy > 25) return; // ignore drag (> 5px)

      const rect  = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      raycaster.setFromCamera(mouse, camera);

      const hitTargets = [...bodyGroup.children];
      if (earthMesh) hitTargets.push(earthMesh);
      const hits = raycaster.intersectObjects(hitTargets, true);
      if (hits.length > 0) {
        let node = hits[0].object;
        while (node && node.userData.objectId == null) node = node.parent;
        const id = node?.userData.objectId;
        if (id != null) selectObject(id);
      }
    });

    // ── Focus animation ───────────────────────────────────────────────────────
    let targetGoal = null;

    function focusOn(id) {
      launchCam  = null;
      cameraGoal = null;
      setCameraUp(SCENE_UP);
      if (id === EARTH_MARKER_ID) {
        targetGoal = new THREE.Vector3(0, 0, 0);
        controls.minDistance = earthRadius * SCALE * 1.05;
        return;
      }
      const obj = spacecraft.find(o => o.id === id);
      const ePos = earthObj?.cart?.pos;
      if (!obj?.cart?.pos || !ePos) return;
      targetGoal = toThree(obj.cart.pos.x - ePos.x, obj.cart.pos.y - ePos.y, obj.cart.pos.z - ePos.z);
      controls.minDistance = (obj.radius != null && obj.radius > 0)
        ? obj.radius * 2 * SCALE
        : 0.02;
    }

    // ── Launch camera ─────────────────────────────────────────────────────────
    // When KSD selects a spacecraft that isn't in orbit yet:
    //  1. Move the target onto the rocket and the camera straight above it
    //     (pitch 90°: Earth centre → rocket → camera on one line, looking down),
    //     with the rocket's local vertical as the camera's up axis.
    //  2. Follow the rocket: each telemetry update moves the target and the camera
    //     by the rocket's displacement.
    //  3. Above LAUNCH_PITCH_ALT_KM, lower the pitch from 90° to LAUNCH_SIDE_PITCH
    //     so the trajectory is seen obliquely from the side. The side it swings out to
    //     (the yaw) is perpendicular to the current flight plane — the horizontal
    //     direction of the inertial velocity — so a near-polar launch is seen from the
    //     east / west rather than from along its track.
    //  4. On orbit insertion, pull back to LAUNCH_ORBIT_DIST while lowering the pitch
    //     to 0° (looking along the flight plane's normal) and moving the target from
    //     the rocket to the Earth's centre, so the whole orbit is seen face-on, centred.
    //     From then on the camera stays put and the rocket travels around the orbit.
    // All moves are gradual. The viewer may still drag / zoom meanwhile; the
    // automatic moves carry on regardless, easing the camera back onto its path
    // rather than snapping it there.
    // Distances are in scene units (1 unit = 1000 km).
    const LAUNCH_CAM_TOP_DIST  = 7.0; // camera distance at pitch 90° (straight above)
    const LAUNCH_CAM_SIDE_DIST = 3.0; // camera distance at pitch 0° (beside the trajectory)
    const LAUNCH_PITCH_ALT_KM  = 60;
    const LAUNCH_SIDE_PITCH    = THREE.MathUtils.degToRad(30); // pitch after pitching down
    const LAUNCH_PITCH_RATE    = THREE.MathUtils.degToRad(20); // per second → 3 s from 90° to 30°
    const LAUNCH_CAM_SMOOTHING = 3.0; // 1/s: how quickly the camera eases onto its pitch-down path
    const LAUNCH_ORBIT_DIST    = 30.0; // camera distance after orbit insertion (30,000 km)
    const LAUNCH_PULL_RATE     = 0.8;  // 1/s: how quickly it pulls back (roughly 4 s to get there)
    let cameraGoal = null;
    // { id, last: rocket position, up: local vertical, side: horizontal direction the camera
    //   swings toward when pitching down, pitch: current pitch (rad), pitching: lowering the pitch now }
    let launchCam = null;

    // Spacecraft position (scene units, Earth-relative) and velocity (m/s, same axes) in scene coordinates
    function craftState3(id) {
      const obj = spacecraft.find(o => o.id === id);
      const ePos = earthObj?.cart?.pos;
      if (!obj?.cart?.pos || !ePos) return null;
      const pos = toThree(obj.cart.pos.x - ePos.x, obj.cart.pos.y - ePos.y, obj.cart.pos.z - ePos.z);
      const vel = obj.cart.vel ? dirToThree(obj.cart.vel) : new THREE.Vector3();
      return { pos, vel };
    }

    // Horizontal flight direction: the horizontal part of the velocity, or due east when it's (nearly) zero
    function downrangeOf(state) {
      const up = state.pos.clone().normalize();
      const h = state.vel.clone().addScaledVector(up, -state.vel.dot(up));
      if (h.length() > 1.0) return h.normalize();
      const axis = earthObj?.orientation?.north ? dirToThree(earthObj.orientation.north).normalize() : SCENE_UP.clone();
      const east = new THREE.Vector3().crossVectors(axis, up);
      return east.lengthSq() > 1e-9 ? east.normalize() : new THREE.Vector3(1, 0, 0);
    }

    // Camera position for a given pitch: 90° = straight above the target, 0° = level with it, off to the side
    function launchCamPosition(pitch) {
      const t = pitch / (Math.PI / 2);
      const dist = THREE.MathUtils.lerp(LAUNCH_CAM_SIDE_DIST, LAUNCH_CAM_TOP_DIST, t);
      const dir = launchCam.side.clone().multiplyScalar(Math.cos(pitch)).addScaledVector(launchCam.up, Math.sin(pitch));
      return controls.target.clone().addScaledVector(dir, dist);
    }

    function startLaunchCamera(id) {
      const st = craftState3(id);
      if (!st) return false;
      const up = st.pos.clone().normalize();
      // Swinging toward this side when pitching down keeps downrange pointing right on screen
      const side = new THREE.Vector3().crossVectors(downrangeOf(st), up).normalize();
      setCameraUp(up);
      controls.minDistance = 0.02;
      launchCam = { id, last: st.pos.clone(), up, side, pitch: Math.PI / 2, pitching: false };
      targetGoal = st.pos.clone();
      // Pitch a hair under 90°: exactly straight down leaves the view's heading undefined
      const pitch = Math.PI / 2 - 1e-3;
      const dir = side.clone().multiplyScalar(Math.cos(pitch)).addScaledVector(up, Math.sin(pitch));
      cameraGoal = st.pos.clone().addScaledVector(dir, LAUNCH_CAM_TOP_DIST);
      launchCam.pitch = pitch;
      return true;
    }

    // Called after every telemetry update: follow the rocket and start pitching down above the threshold
    function updateLaunchCamera(inOrbit) {
      if (!launchCam) return;
      if (selectedId !== launchCam.id) { launchCam = null; return; }
      const st = craftState3(launchCam.id);
      if (!st) return;
      // Follow the rocket until orbit insertion; after that the target heads for the Earth's centre
      if (!launchCam.pulling) {
        const delta = st.pos.clone().sub(launchCam.last);
        camera.position.add(delta);
        controls.target.add(delta);
        if (targetGoal) targetGoal.add(delta);
        if (cameraGoal) cameraGoal.add(delta);
      }
      launchCam.last = st.pos.clone();

      const altKm = (st.pos.length() / SCALE - earthRadius) / 1000;
      if (!launchCam.pitching && altKm >= LAUNCH_PITCH_ALT_KM) {
        launchCam.pitching = true;
      }
      if (launchCam.pitching && !launchCam.settled) {
        // Yaw: swing out perpendicular to the flight plane, keeping downrange to the right.
        // Re-evaluated while pitching; the camera eases onto the path, so it turns smoothly.
        const h = downrangeOf(st);
        h.addScaledVector(launchCam.up, -h.dot(launchCam.up));
        if (h.lengthSq() > 1e-9) {
          launchCam.side = new THREE.Vector3().crossVectors(h.normalize(), launchCam.up).normalize();
        }
      }
      if (!launchCam.pulling && inOrbit === true) {
        launchCam.pulling = true;
        launchCam.pullDist = camera.position.distanceTo(controls.target);
        launchCam.focus = 0;      // 0 = target on the rocket, 1 = on the Earth's centre
        launchCam.settled = true; // the pitch-down (if still going) stops here; the pull-back takes over
        cameraGoal = null;
        targetGoal = null;
      }
    }

    // Called every frame after orbit insertion: back the camera away from the rocket,
    // keeping its viewing direction, until it is LAUNCH_ORBIT_DIST away
    function stepOrbitPull(dt) {
      if (!launchCam?.pulling || launchCam.pulled) return;
      // Pitch down to 0° at the same rate as the launch pitch-down, and ease the distance out
      launchCam.pitch = Math.max(0, launchCam.pitch - LAUNCH_PITCH_RATE * dt);
      // The distance and the target's move to the Earth's centre ease on their own
      // (not from the camera's actual, lagging state)
      const k = 1 - Math.exp(-LAUNCH_PULL_RATE * dt);
      launchCam.pullDist = THREE.MathUtils.lerp(launchCam.pullDist, LAUNCH_ORBIT_DIST, k);
      launchCam.focus = THREE.MathUtils.lerp(launchCam.focus, 1, k);
      controls.target.copy(launchCam.last).multiplyScalar(1 - launchCam.focus); // the Earth's centre is the origin
      const dir = launchCam.side.clone().multiplyScalar(Math.cos(launchCam.pitch)).addScaledVector(launchCam.up, Math.sin(launchCam.pitch));
      const goal = controls.target.clone().addScaledVector(dir, launchCam.pullDist);
      // Ease onto the path rather than jumping, in case the viewer has moved the camera
      camera.position.lerp(goal, 1 - Math.exp(-LAUNCH_CAM_SMOOTHING * dt));
      if (launchCam.pitch <= 0 && Math.abs(LAUNCH_ORBIT_DIST - launchCam.pullDist) < 1e-3 && launchCam.focus > 1 - 1e-4 && camera.position.distanceTo(goal) < 1e-3) {
        controls.target.set(0, 0, 0);
        launchCam.pulled = true; // done; the camera stays put around the Earth from here on
      }
    }

    // Called every frame: lower the pitch toward 0° once pitching has started
    function stepLaunchPitch(dt) {
      if (!launchCam?.pitching || launchCam.settled) return;
      cameraGoal = null; // the pitch-down takes over from the initial approach
      launchCam.pitch = Math.max(LAUNCH_SIDE_PITCH, launchCam.pitch - LAUNCH_PITCH_RATE * dt);
      // Ease toward the path instead of jumping onto it, so a camera the viewer has
      // moved (or one still on its way in) glides over
      const goal = launchCamPosition(launchCam.pitch);
      camera.position.lerp(goal, 1 - Math.exp(-LAUNCH_CAM_SMOOTHING * dt));
      if (launchCam.pitch <= LAUNCH_SIDE_PITCH && camera.position.distanceTo(goal) < 1e-3) {
        launchCam.settled = true; // done; from here on only the follow translation applies
      }
    }

    // ── Occlusion ──────────────────────────────────────────────────────────────
    // CSS2DRenderer draws marker/label DOM elements as a plain screen-space
    // overlay — it has no idea Earth's mesh is in front of them, so without
    // this they'd float visibly "through" Earth. Ray-test each one against
    // Earth's sphere every frame (camera moves continuously via OrbitControls
    // even between telemetry polls) and hide the ones on the far side.
    //
    // Important: this must set CSS2DObject.visible, NOT style.display on the
    // wrapper directly — CSS2DRenderer.render() unconditionally overwrites
    // style.display from object.visible on every single frame, so poking the
    // DOM style here would just get clobbered by the very next
    // labelRenderer.render() call in animate().
    function updateOcclusion() {
      const camPos = camera.position;
      for (const t of occlusionTargets) {
        const toTarget  = t.pos.clone().sub(camPos);
        const distToObj = toTarget.length();
        occlusionRay.origin.copy(camPos);
        occlusionRay.direction.copy(toTarget).divideScalar(distToObj || 1);
        const hit    = occlusionRay.intersectSphere(occlusionSphere, occlusionHit);
        const hidden = !!hit && occlusionHit.distanceTo(camPos) < distToObj - 1e-6;
        t.markerObj.visible = !hidden;
        t.labelObj.visible  = !hidden;
      }
    }

    // ── Animation loop ────────────────────────────────────────────────────────
    const frameClock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(frameClock.getDelta(), 0.1);
      if (targetGoal) {
        controls.target.lerp(targetGoal, 0.08);
        if (controls.target.distanceTo(targetGoal) < 0.0001) {
          controls.target.copy(targetGoal);
          targetGoal = null;
        }
      }
      if (cameraGoal) {
        camera.position.lerp(cameraGoal, 0.08);
        if (camera.position.distanceTo(cameraGoal) < 0.0001) {
          camera.position.copy(cameraGoal);
          cameraGoal = null;
        }
      }
      stepLaunchPitch(dt);
      stepOrbitPull(dt);
      stepDataFeed(dt);
      controls.update();
      updateOcclusion();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }

    // ── UI logic ──────────────────────────────────────────────────────────────
    const POLL_INTERVAL_MS = 1000; // fixed: refresh once per second
    let objectsById = {};    // all objects by id (orbit legs may be relative to non-Earth parents)
    let earthObj   = null;   // the Earth SpaceObject, or null until telemetry arrives
    let sunObj     = null;   // the Sun SpaceObject, used only to aim sunLight
    let spacecraft = [];     // objects whose parentId === earthObj.id
    let selectedId = null;   // number (spacecraft id) or EARTH_MARKER_ID
    let lastKsdSelectedId;   // selectedId last reported by KSD (undefined until the first poll)

    function render(data) {
      const objects = (data.objects ?? []).slice().sort((a, b) => a.id - b.id);
      objectsById = Object.fromEntries(objects.map(o => [o.id, o]));
      earthObj = objects.find(o => o.id === EARTH_ID) ?? null;
      sunObj   = objects.find(o => o.id === SUN_ID) ?? null;
      spacecraft = earthObj
        ? objects.filter(o => o.parentId === earthObj.id && !HIDDEN_TYPES.has((o.type ?? "").trim().toLowerCase()))
        : [];

      // Follow the selection made in KSD whenever it changes. Between changes the
      // viewer may click another object; that choice stays until KSD selects again.
      if (data.selectedId !== lastKsdSelectedId) {
        lastKsdSelectedId = data.selectedId;
        const ksdPick = data.selectedId === EARTH_ID ? EARTH_MARKER_ID
          : spacecraft.some(o => o.id === data.selectedId) ? data.selectedId : null;
        if (ksdPick != null) {
          selectedId = ksdPick;
          // selectedInOrbit comes in the same response as selectedId, so it always describes this selection
          const launching = ksdPick !== EARTH_MARKER_ID && data.selectedInOrbit === false;
          if (!(launching && startLaunchCamera(ksdPick))) {
            focusOn(ksdPick);
          }
        }
      }

      if (earthObj && selectedId == null) selectedId = EARTH_MARKER_ID;
      if (selectedId !== EARTH_MARKER_ID && !spacecraft.some(o => o.id === selectedId)) {
        selectedId = earthObj ? EARTH_MARKER_ID : null;
      }

      updateScene();
      updateLaunchCamera(data.selectedInOrbit);
      updateMissionPanel(data);
      drawGroundTrack();
    }

    // ── Flight chart ──────────────────────────────────────────────────────────
    // Surface speed and altitude of the spacecraft selected in KSD, against
    // in-game time since it was selected. The server keeps the history (and
    // restarts it when the selection changes); this only draws it.
    // Each axis steps up through these scales as the values grow; the last
    // one is the ceiling (values beyond it run off the top).
    const CHART_SPEED_SCALES = [{ max: 2.5 }, { max: 5 }, { max: 10 }];  // km/s, left axis
    const CHART_ALT_SCALES   = [{ max: 100 }, { max: 300 }, { max: 600 }, { max: 1200 }]; // km, right axis
    // Both y axes share the same horizontal grid: always this many divisions, so
    // each label is max / CHART_Y_DIVISIONS × k and the left/right labels line up
    const CHART_Y_DIVISIONS = 5;
    // Time axis: 100 s → 300 s → 600 s → 1000 s, then a sliding window of the latest 1000 s
    // tick: tick-mark interval, label: label interval
    const CHART_TIME_SCALES = [
      { span: 100,  tick: 10,  label: 20 },
      { span: 300,  tick: 50,  label: 50 },
      { span: 600,  tick: 50,  label: 100 },
      { span: 1000, tick: 100, label: 100 },
    ];
    const CHART_SPEED_COLOR   = '#7fcf9c'; // slightly desaturated green
    const CHART_ALT_COLOR     = '#ff9f43'; // orange
    const CHART_AXIS_COLOR    = 'rgba(200, 216, 240, 0.85)';
    const CHART_GRID_COLOR    = 'rgba(200, 216, 240, 0.12)';
    const flightChartEl     = document.getElementById('flight-chart');
    const flightChartCanvas = document.getElementById('flight-chart-canvas');
    let lastHistory = null;

    // Smallest scale that fits value (the largest one if none does)
    function pickScale(scales, value, key = 'max') {
      return scales.find(sc => value <= sc[key]) ?? scales[scales.length - 1];
    }

    // Returns [t0, t1, scale]: 0..span while it fits, then the sliding window of the largest span
    function chartTimeRange(lastT) {
      const sc = pickScale(CHART_TIME_SCALES, lastT, 'span');
      return lastT <= sc.span ? [0, sc.span, sc] : [lastT - sc.span, lastT, sc];
    }

    // Sizes the canvas to its box and returns the cleared context and the plot-area layout.
    // Both charts are the same size, so their plot areas line up one above the other.
    function beginChart(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width  = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
      }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const fontPx = Math.max(10, Math.round(h / 24));
      const pad = { left: fontPx * 5.2, right: fontPx * 5.2, top: fontPx * 1.2, bottom: fontPx * 3.4 };
      return { ctx, w, h, fontPx, pad, pw: w - pad.left - pad.right, ph: h - pad.top - pad.bottom };
    }

    // Time ticks and labels, the plot frame and the time axis title
    function drawTimeAxis(c, t0, t1, timeScale) {
      const { ctx, fontPx, pad, pw, ph } = c;
      const xOf = t => pad.left + (t - t0) / (t1 - t0) * pw;
      ctx.font = `${fontPx}px "Courier New", monospace`;
      ctx.lineWidth = 1;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = CHART_AXIS_COLOR;
      ctx.strokeStyle = CHART_AXIS_COLOR;
      for (let t = Math.ceil(t0 / timeScale.tick) * timeScale.tick; t <= t1 + 1e-9; t += timeScale.tick) {
        const x = xOf(t);
        ctx.beginPath(); ctx.moveTo(x, pad.top + ph); ctx.lineTo(x, pad.top + ph + fontPx * 0.4); ctx.stroke();
        if (Math.round(t) % timeScale.label === 0) {
          ctx.fillText(String(Math.round(t)), x, pad.top + ph + fontPx * 0.6);
        }
      }

      ctx.beginPath();
      ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, pad.top + ph);
      ctx.lineTo(pad.left + pw, pad.top + ph); ctx.lineTo(pad.left + pw, pad.top);
      ctx.stroke();

      ctx.font = `${Math.round(fontPx * 1.05)}px "Courier New", monospace`;
      ctx.textBaseline = 'middle';
      ctx.fillText('TIME [sec]', pad.left + pw / 2, pad.top + ph + fontPx * 2.3);
    }

    // Kármán line (the dashboard shows the Earth), dashed across the plot at height y
    const CHART_KARMAN_KM = 100;
    function drawKarmanLine(c, y) {
      const { ctx, fontPx, pad, pw } = c;
      ctx.save();
      ctx.setLineDash([6, 4]);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(200, 216, 240, 0.45)';
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + pw, y); ctx.stroke();
      ctx.font = `${fontPx}px "Courier New", monospace`;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(200, 216, 240, 0.6)';
      ctx.fillText('KARMAN LINE', pad.left + pw - fontPx * 0.4, y - 2);
      ctx.restore();
    }

    // A y-axis title rotated along the left (side < 0) or right (side > 0) edge
    function drawYTitle(c, text, color, side) {
      const { ctx, w, fontPx, pad, ph } = c;
      ctx.save();
      ctx.font = `${Math.round(fontPx * 1.05)}px "Courier New", monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.translate(side < 0 ? fontPx * 1.1 : w - fontPx * 1.1, pad.top + ph / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = color;
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    // One series through the samples, clipped to the plot area (values beyond the
    // largest scale run off the edge). yOf returns null where the value is missing,
    // which breaks the line there.
    function plotSeries(c, samples, xOf, yOf, color) {
      const { ctx, pad, pw, ph } = c;
      ctx.save();
      ctx.beginPath(); ctx.rect(pad.left, pad.top, pw, ph); ctx.clip();
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = color;
      ctx.beginPath();
      let pen = false;
      for (const p of samples) {
        const y = yOf(p);
        if (y == null) { pen = false; continue; }
        if (pen) ctx.lineTo(xOf(p.t), y); else ctx.moveTo(xOf(p.t), y);
        pen = true;
      }
      ctx.stroke();
      ctx.restore();
    }

    // Always shown. While something other than a spacecraft is selected (no samples),
    // keep drawing the last spacecraft's history; before any, just the empty axes.
    let lastChartSamples = [];
    function drawFlightChart(history) {
      if (history?.samples?.length) {
        lastChartSamples = history.samples;
      }
      const samples = lastChartSamples;

      const c = beginChart(flightChartCanvas);
      const { ctx, fontPx, pad, pw, ph } = c;
      const [t0, t1, timeScale] = chartTimeRange(samples.length ? samples[samples.length - 1].t : 0);
      const speedScale = pickScale(CHART_SPEED_SCALES, Math.max(...samples.map(p => p.surfaceSpeed)) / 1000);
      const altScale   = pickScale(CHART_ALT_SCALES,   Math.max(...samples.map(p => p.altitude)) / 1000);
      const xOf    = t => pad.left + (t - t0) / (t1 - t0) * pw;
      const ySpeed = kms => pad.top + ph - kms / speedScale.max * ph;
      const yAlt   = km  => pad.top + ph - km / altScale.max * ph;

      ctx.font = `${fontPx}px "Courier New", monospace`;
      ctx.lineWidth = 1;

      // Horizontal grid shared by both y axes (e.g. 600 km → 120, 240, 360, 480, 600)
      ctx.textBaseline = 'middle';
      for (let k = 0; k <= CHART_Y_DIVISIONS; k++) {
        const y = pad.top + ph - (k / CHART_Y_DIVISIONS) * ph;
        ctx.strokeStyle = CHART_GRID_COLOR;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + pw, y); ctx.stroke();
        ctx.fillStyle = CHART_SPEED_COLOR;
        ctx.textAlign = 'right';
        ctx.fillText((k * speedScale.max / CHART_Y_DIVISIONS).toFixed(1), pad.left - fontPx * 0.5, y);
        ctx.fillStyle = CHART_ALT_COLOR;
        ctx.textAlign = 'left';
        ctx.fillText(String(Math.round(k * altScale.max / CHART_Y_DIVISIONS)), pad.left + pw + fontPx * 0.5, y);
      }

      drawKarmanLine(c, yAlt(CHART_KARMAN_KM));   // on the altitude (right) axis
      drawTimeAxis(c, t0, t1, timeScale);
      drawYTitle(c, 'SURFACE VELOCITY [km/s]', CHART_SPEED_COLOR, -1);
      drawYTitle(c, 'ALTITUDE [km]', CHART_ALT_COLOR, 1);

      plotSeries(c, samples, xOf, p => yAlt(p.altitude / 1000), CHART_ALT_COLOR);
      plotSeries(c, samples, xOf, p => ySpeed(p.surfaceSpeed / 1000), CHART_SPEED_COLOR);
    }

    // ── Orbit chart (above the flight chart) ─────────────────────────────────
    // Apoapsis altitude (left axis) and eccentricity (right axis) of the same
    // spacecraft on the same time axis. During the ascent the eccentricity starts
    // near 1 (a steep ballistic arc) and falls as the orbit rounds out.
    // The apoapsis axis runs from 0 (the surface) to max, max stepping up with the
    // highest apoapsis shown (values above the largest scale run off the top).
    // The eccentricity axis is fixed at 0..1 (hyperbolic values run off the top).
    const ORBIT_SCALES = [100, 300, 600, 1200, 3000, 6000, 12000, 30000, 60000, 120000, 300000, 600000].map(max => ({ max })); // km
    const ORBIT_Y_DIVISIONS = CHART_Y_DIVISIONS;   // same as the flight chart (e.g. 300 km → 60, 120, ...)
    const ORBIT_AP_COLOR    = '#5ec8ff';   // light blue
    const ORBIT_ECC_COLOR   = '#ff6fae';   // pink
    const orbitChartCanvas  = document.getElementById('orbit-chart-canvas');

    function drawOrbitChart() {
      const samples = lastChartSamples;   // kept by drawFlightChart
      const c = beginChart(orbitChartCanvas);
      const { ctx, fontPx, pad, pw, ph } = c;
      const [t0, t1, timeScale] = chartTimeRange(samples.length ? samples[samples.length - 1].t : 0);
      const apMax = Math.max(0, ...samples.filter(p => p.apoapsis != null).map(p => p.apoapsis / 1000));
      const scale = pickScale(ORBIT_SCALES, apMax);
      const xOf = t => pad.left + (t - t0) / (t1 - t0) * pw;
      const yOf    = km => pad.top + ph - km / scale.max * ph;
      const yOfEcc = e  => pad.top + ph - e * ph;

      // Horizontal grid, labelled on both sides in the colour of that side's line
      ctx.font = `${fontPx}px "Courier New", monospace`;
      ctx.lineWidth = 1;
      ctx.textBaseline = 'middle';
      for (let k = 0; k <= ORBIT_Y_DIVISIONS; k++) {
        const km = k * scale.max / ORBIT_Y_DIVISIONS;
        const y = yOf(km);
        ctx.strokeStyle = CHART_GRID_COLOR;
        ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + pw, y); ctx.stroke();
        ctx.fillStyle = ORBIT_AP_COLOR;
        ctx.textAlign = 'right';
        ctx.fillText(String(Math.round(km)), pad.left - fontPx * 0.5, y);
        ctx.fillStyle = ORBIT_ECC_COLOR;
        ctx.textAlign = 'left';
        ctx.fillText((k / ORBIT_Y_DIVISIONS).toFixed(1), pad.left + pw + fontPx * 0.5, y);
      }

      drawKarmanLine(c, yOf(CHART_KARMAN_KM));   // on the apoapsis (left) axis

      drawTimeAxis(c, t0, t1, timeScale);
      drawYTitle(c, 'APOAPSIS [km]', ORBIT_AP_COLOR, -1);
      drawYTitle(c, 'ECCENTRICITY', ORBIT_ECC_COLOR, 1);

      plotSeries(c, samples, xOf, p => p.apoapsis     == null ? null : yOf(p.apoapsis / 1000), ORBIT_AP_COLOR);
      plotSeries(c, samples, xOf, p => p.eccentricity == null ? null : yOfEcc(p.eccentricity), ORBIT_ECC_COLOR);
    }

    window.addEventListener('resize', () => { drawFlightChart(lastHistory); drawOrbitChart(); });

    async function fetchHistory() {
      try {
        const res = await fetch("/api/history");
        if (res.ok) lastHistory = await res.json();
      } catch (e) {
        console.warn(`[history] ${e.message}`);
      }
      drawFlightChart(lastHistory);
      drawOrbitChart();
    }

    // ── Data feed (purely decorative) ────────────────────────────────────────
    // Every object's name and velocity, one object per row
    // ("VEL X=  7612.345 m/s Y= ..."), scrolling smoothly upward at a steady rate. Each time the rows queued below the panel run low, the latest
    // response is appended as a block; blocks scrolled out of view are dropped.
    // Velocity is in m/s, as received.
    const dataFeedEl   = document.getElementById("data-feed");
    const dataFeedText = document.getElementById("data-feed-text");
    const DATA_FEED_LINE_HEIGHT   = 16;  // px, same as the CSS row height
    const DATA_FEED_LINE_INTERVAL = 0.4; // s per row (scroll speed)
    const DATA_FEED_NAME_WIDTH    = 30;  // half-width columns; full-width characters count as 2
    let latestFeedObjects = null;
    let dataFeedOffset = 0;              // px scrolled past the top of the first block

    function showDataFeed(data) {
      latestFeedObjects = (data.objects ?? []).slice().sort((a, b) => a.id - b.id);
    }

    // Cut a name to DATA_FEED_NAME_WIDTH half-width columns (full-width characters take 2)
    function fitName(name) {
      let width = 0, out = "";
      for (const ch of name) {
        const w = /[\u1100-\u115f\u2e80-\ua4cf\uac00-\ud7a3\uf900-\ufaff\ufe30-\ufe4f\uff00-\uff60\uffe0-\uffe6]/.test(ch) ? 2 : 1;
        if (width + w > DATA_FEED_NAME_WIDTH) break;
        width += w;
        out += ch;
      }
      return out;
    }

    function feedRow(cells) {
      const row = document.createElement("div");
      row.className = "feed-row";
      for (const text of cells) {
        const cell = document.createElement("span");
        cell.textContent = text;
        row.appendChild(cell);
      }
      return row;
    }

    function feedBlock(objects) {
      const block = document.createElement("div");
      // Value right-aligned in a fixed number of columns after its label (all ASCII, so padding lines up)
      const field = (label, v) =>
        `${label}=${((v == null || !Number.isFinite(v)) ? "-" : v.toFixed(3)).padStart(10)} m/s`;
      for (const o of objects) {
        const v = o.cart?.vel;
        block.appendChild(feedRow([
          fitName(o.name ?? String(o.id)),
          field("VEL X", v?.x), field("Y", v?.y), field("Z", v?.z),
        ]));
      }
      return block;
    }

    function stepDataFeed(dt) {
      if (!latestFeedObjects) return;
      // Keep at least two panel-heights of rows queued below the visible area
      for (let i = 0; i < 50 && dataFeedText.offsetHeight - dataFeedOffset < dataFeedEl.clientHeight * 2; i++) {
        dataFeedText.appendChild(feedBlock(latestFeedObjects));
      }
      dataFeedOffset += DATA_FEED_LINE_HEIGHT / DATA_FEED_LINE_INTERVAL * dt;
      // Drop chunks that have scrolled completely out of view
      let first = dataFeedText.firstElementChild;
      while (first && dataFeedText.childElementCount > 1 && first.offsetHeight <= dataFeedOffset) {
        dataFeedOffset -= first.offsetHeight;
        first.remove();
        first = dataFeedText.firstElementChild;
      }
      dataFeedText.style.transform = `translateY(${-dataFeedOffset}px)`;
    }

    // ── Mission clock + flight event log (top left) ───────────────────────────
    // For the spacecraft selected in KSD: T- countdown before launch, T+ after it,
    // and KSD's flight log, added one row at a time from the top (newest at the bottom).
    const missionPanelEl   = document.getElementById("mission-panel");
    const missionCaptionEl = document.getElementById("mission-caption");
    const metEl            = document.getElementById("met");
    const eventLogEl       = document.getElementById("event-log");
    const EVENT_LABELS = {
      LiftOff: "LIFTOFF", MaxQ: "MAX-Q", BoosterJettison: "BOOSTER SEP", StageSeparation: "STAGE SEP",
      FairingDeployment: "FAIRING SEP", EngineIgnition: "ENGINE IGNITION", EngineCutoff: "ENGINE CUTOFF",
      OrbitInsertion: "ORBIT INSERTION",
    };
    let shownEvents = { id: null, count: 0 };

    function fmtMet(sec) {
      const sign = sec < 0 ? "-" : "+";
      let t = Math.floor(Math.abs(sec));
      const h = Math.floor(t / 3600); t -= h * 3600;
      const m = Math.floor(t / 60);
      const ss = t - m * 60;
      return `T${sign} ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
    }

    // Always shown. While something other than a spacecraft is selected, keep showing
    // the last spacecraft (its clock keeps running); before any, a blank clock.
    let lastMission = null; // { id, name, launchTime, log }

    function updateMissionPanel(data) {
      if (data.selectedId != null && data.selectedLaunchTime != null) {
        lastMission = {
          id: data.selectedId,
          name: objectsById[data.selectedId]?.name ?? String(data.selectedId),
          launchTime: data.selectedLaunchTime,
          log: data.selectedFlightLog ?? [],
        };
      }
      if (!lastMission || data.currentTime == null) {
        missionCaptionEl.textContent = "MISSION ELAPSED TIME";
        metEl.textContent = "T+ --:--:--";
        eventLogEl.replaceChildren();
        shownEvents = { id: null, count: 0 };
        return;
      }
      const id = lastMission.id;
      missionCaptionEl.textContent = `MISSION ELAPSED TIME — ${lastMission.name}`;
      metEl.textContent = fmtMet(data.currentTime - lastMission.launchTime);

      const log = lastMission.log;
      if (shownEvents.id !== id || shownEvents.count !== log.length) {
        const firstNew = shownEvents.id === id ? shownEvents.count : log.length; // don't flash a whole log on selection
        eventLogEl.replaceChildren(...log.map((e, i) => {
          const row = document.createElement("div");
          row.className = i >= firstNew ? "event-row ev-new" : "event-row";
          const cell = (text, cls) => { const c = document.createElement("span"); c.textContent = text; if (cls) c.className = cls; return c; };
          row.append(
            cell(fmtMet(e.time ?? 0)),
            cell(EVENT_LABELS[e.event] ?? String(e.event).toUpperCase(), "ev-name"),
            // Fixed-width fields so the labels and units line up on every row
            cell(e.altitude == null ? "" : `ALT ${(e.altitude / 1000).toFixed(1).padStart(7)} km`, "ev-num"),
            cell(e.velocity == null ? "" : `VEL ${(e.velocity / 1000).toFixed(2).padStart(5)} km/s`, "ev-num"),
          );
          return row;
        }));
        shownEvents = { id, count: log.length };
        // Once the rows overflow, keep the newest in view (the oldest go off the top)
        eventLogEl.scrollTop = eventLogEl.scrollHeight;
      }
    }

    // ── Ground track map (top right) ─────────────────────────────────────────
    // Equirectangular world map (the globe's texture) with the night side shaded,
    // ground sites, other spacecraft, and the selected spacecraft's past ground
    // track plus a predicted one: its current position / velocity propagated as a
    // two-body orbit (RK4) for one revolution (or until it meets the ground), with
    // the Earth turning underneath.
    const groundTrackCanvas = document.getElementById("ground-track-canvas");
    const GM_EARTH_TRACK = 3.986004418e14;                 // m^3/s^2
    const EARTH_SPIN = 2 * Math.PI / 86164.0905;           // rad/s (sidereal day)
    const TRACK_PREDICT_STEPS = 360;
    const TRACK_HISTORY_MAX = 5000;
    let groundTrackHistory = { id: null, points: [] };     // past sub-satellite points of the selected spacecraft

    const dot3 = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;

    // Earth-relative vector (same axes as pos) → [lat, lon] in degrees, using Earth's
    // orientation rotated by `spin` radians (the Earth's turn after `spin / EARTH_SPIN` s)
    function latLonOf(rel, o, spin = 0) {
      const c = Math.cos(spin), sn = Math.sin(spin);
      const px = dot3(rel, o.primeMeridian), py = dot3(rel, o.east), pz = dot3(rel, o.north);
      // the body's prime meridian turns toward east: prime(t) = prime·cos + east·sin, east(t) = east·cos − prime·sin
      const x = px * c + py * sn, y = py * c - px * sn;
      return [Math.atan2(pz, Math.hypot(x, y)) * 180 / Math.PI, Math.atan2(y, x) * 180 / Math.PI];
    }

    function relToEarth(obj) {
      const p = obj?.cart?.pos, e = earthObj?.cart?.pos;
      return p && e ? { x: p.x - e.x, y: p.y - e.y, z: p.z - e.z } : null;
    }

    // Future sub-satellite points from the current state (two-body, RK4)
    function predictGroundTrack(r0, v0, o) {
      const r = Math.hypot(r0.x, r0.y, r0.z), v2 = dot3(v0, v0);
      const energy = v2 / 2 - GM_EARTH_TRACK / r;
      const a = -GM_EARTH_TRACK / (2 * energy);
      const duration = energy < 0 ? Math.min(2 * Math.PI * Math.sqrt(a * a * a / GM_EARTH_TRACK), 6 * 3600) : 2 * 3600;
      const dt = duration / TRACK_PREDICT_STEPS;
      const acc = (p) => { const d = Math.hypot(p.x, p.y, p.z); const k = -GM_EARTH_TRACK / (d * d * d); return { x: p.x * k, y: p.y * k, z: p.z * k }; };
      const add = (p, q, f) => ({ x: p.x + q.x * f, y: p.y + q.y * f, z: p.z + q.z * f });
      let p = { ...r0 }, v = { ...v0 };
      const out = [];
      for (let i = 1; i <= TRACK_PREDICT_STEPS; i++) {
        const k1v = acc(p),                      k1p = v;
        const k2v = acc(add(p, k1p, dt / 2)),    k2p = add(v, k1v, dt / 2);
        const k3v = acc(add(p, k2p, dt / 2)),    k3p = add(v, k2v, dt / 2);
        const k4v = acc(add(p, k3p, dt)),        k4p = add(v, k3v, dt);
        p = { x: p.x + dt / 6 * (k1p.x + 2 * k2p.x + 2 * k3p.x + k4p.x), y: p.y + dt / 6 * (k1p.y + 2 * k2p.y + 2 * k3p.y + k4p.y), z: p.z + dt / 6 * (k1p.z + 2 * k2p.z + 2 * k3p.z + k4p.z) };
        v = { x: v.x + dt / 6 * (k1v.x + 2 * k2v.x + 2 * k3v.x + k4v.x), y: v.y + dt / 6 * (k1v.y + 2 * k2v.y + 2 * k3v.y + k4v.y), z: v.z + dt / 6 * (k1v.z + 2 * k2v.z + 2 * k3v.z + k4v.z) };
        if (Math.hypot(p.x, p.y, p.z) < earthRadius) break; // came down
        out.push(latLonOf(p, o, EARTH_SPIN * dt * i));
      }
      return out;
    }

    function drawGroundTrack() {
      const o = earthObj?.orientation;
      const dpr = window.devicePixelRatio || 1;
      const w = groundTrackCanvas.clientWidth, h = groundTrackCanvas.clientHeight;
      if (groundTrackCanvas.width !== Math.round(w * dpr) || groundTrackCanvas.height !== Math.round(h * dpr)) {
        groundTrackCanvas.width = Math.round(w * dpr);
        groundTrackCanvas.height = Math.round(h * dpr);
      }
      const ctx = groundTrackCanvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      // The map keeps its 2:1 aspect, centred in the panel
      const mw = Math.min(w, h * 2), mh = mw / 2;
      const ox = (w - mw) / 2, oy = (h - mh) / 2;
      const X = lon => ox + (lon + 180) / 360 * mw;
      const Y = lat => oy + (90 - lat) / 180 * mh;

      // Map
      const img = earthTexture.image;
      if (img && img.complete && img.naturalWidth) {
        ctx.globalAlpha = 0.55;
        ctx.drawImage(img, ox, oy, mw, mh);
        ctx.globalAlpha = 1;
      }
      if (!o) return;

      // Night side
      const sunRel = relToEarth(sunObj);
      if (sunRel) {
        const [sLat, sLon] = latLonOf(sunRel, o);
        const d2r = Math.PI / 180, cs = Math.cos(sLat * d2r), ss = Math.sin(sLat * d2r);
        ctx.fillStyle = "rgba(0, 0, 20, 0.45)";
        for (let lat = -88; lat < 90; lat += 4) {
          for (let lon = -178; lon < 180; lon += 4) {
            const cz = Math.cos(lat * d2r) * cs * Math.cos((lon - sLon) * d2r) + Math.sin(lat * d2r) * ss;
            if (cz < 0) ctx.fillRect(X(lon - 2), Y(lat + 2), mw / 90 + 0.5, mh / 45 + 0.5);
          }
        }
      }

      // Graticule
      ctx.strokeStyle = "rgba(200, 216, 240, 0.15)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let lon = -150; lon < 180; lon += 30) { ctx.moveTo(X(lon), oy); ctx.lineTo(X(lon), oy + mh); }
      for (let lat = -60; lat <= 60; lat += 30) { ctx.moveTo(ox, Y(lat)); ctx.lineTo(ox + mw, Y(lat)); }
      ctx.stroke();

      // Polyline that breaks where it wraps around the ±180° edge
      const polyline = (pts) => {
        ctx.beginPath();
        pts.forEach(([lat, lon], i) => {
          const x = X(lon), y = Y(lat);
          if (i === 0 || Math.abs(lon - pts[i - 1][1]) > 180) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      };

      // Ground sites and other spacecraft
      for (const obj of Object.values(objectsById)) {
        if (obj.parentId !== EARTH_ID || obj.id === selectedId) continue;
        const rel = relToEarth(obj);
        if (!rel) continue;
        const [lat, lon] = latLonOf(rel, o);
        if (HIDDEN_TYPES.has((obj.type ?? "").trim().toLowerCase())) {
          ctx.fillStyle = "rgba(255, 210, 120, 0.85)";
          ctx.fillRect(X(lon) - 2, Y(lat) - 2, 4, 4);
        } else {
          ctx.fillStyle = "rgba(85, 136, 187, 0.9)";
          ctx.beginPath(); ctx.arc(X(lon), Y(lat), 2, 0, 2 * Math.PI); ctx.fill();
        }
      }

      // Selected spacecraft
      const sel = spacecraft.find(c => c.id === selectedId);
      const rel = relToEarth(sel);
      if (!sel || !rel) { groundTrackHistory = { id: null, points: [] }; return; }
      const now = latLonOf(rel, o);
      if (groundTrackHistory.id !== sel.id) groundTrackHistory = { id: sel.id, points: [] };
      groundTrackHistory.points.push(now);
      if (groundTrackHistory.points.length > TRACK_HISTORY_MAX) groundTrackHistory.points.shift();

      if (sel.cart?.vel) {
        ctx.strokeStyle = "rgba(127, 207, 156, 0.9)";
        ctx.setLineDash([6, 4]);
        polyline([now, ...predictGroundTrack(rel, sel.cart.vel, o)]);
        ctx.setLineDash([]);
      }
      ctx.strokeStyle = "rgba(255, 192, 77, 0.95)";
      ctx.lineWidth = 2;
      polyline(groundTrackHistory.points);

      ctx.fillStyle = "#3ddc84";
      ctx.beginPath(); ctx.arc(X(now[1]), Y(now[0]), 5, 0, 2 * Math.PI); ctx.fill();

      // Read-out
      const alt = (Math.hypot(rel.x, rel.y, rel.z) - earthRadius) / 1000;
      const fmtLat = v => `${Math.abs(v).toFixed(2)}°${v >= 0 ? "N" : "S"}`;
      const fmtLon = v => `${Math.abs(v).toFixed(2)}°${v >= 0 ? "E" : "W"}`;
      ctx.font = `13px "Courier New", monospace`;
      ctx.fillStyle = "#ffffff";
      ctx.shadowColor = "rgba(0, 0, 0, 0.9)"; ctx.shadowBlur = 4;
      ctx.fillText("GROUND TRACK", ox + 10, oy + 18);
      ctx.fillText(`LAT ${fmtLat(now[0])}  LON ${fmtLon(now[1])}  ALT ${alt.toFixed(1)} km`, ox + 10, oy + mh - 10);
      ctx.shadowBlur = 0;
    }

    window.addEventListener('resize', () => drawGroundTrack());

    async function poll() {
      try {
        const historyDone = fetchHistory();
        const trackDone   = fetchTrack();
        const res  = await fetch("/api/objects");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        showDataFeed(data);
        await refreshOrbits(data.objects ?? []);
        await trackDone;
        render(data);
        await historyDone;
      } catch (e) {
        console.warn(`[poll] ${e.message}`);
      }
    }

    // Schedule the next poll only after the current one finishes, so slow
    // responses (e.g. orbit-line fetches) never pile up overlapping requests.
    async function pollLoop() {
      await poll();
      setTimeout(pollLoop, POLL_INTERVAL_MS);
    }

    // Start the render loop only now: it uses state declared throughout the script above
    animate();
    pollLoop();
  </script>
</body>
</html>
