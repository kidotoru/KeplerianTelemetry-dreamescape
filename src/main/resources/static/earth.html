<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keplerian Telemetry — Earth View</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #3ddc84;
      font-family: "Courier New", monospace;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Three.js canvas container ── */
    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ── UI overlay ── */
    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    header, #sidebar, #detail-panel { pointer-events: auto; }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid rgba(30,48,80,0.8);
      background: rgba(10,14,26,0.85);
      backdrop-filter: blur(4px);
      flex-shrink: 0;
      gap: 12px;
    }

    header h1 {
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 0.15em;
      color: #7eb8f7;
      text-transform: uppercase;
    }

    #nav-link {
      font-size: 10px;
      letter-spacing: 0.08em;
      color: #4a6a90;
      text-decoration: none;
      border: 1px solid #2a4060;
      border-radius: 3px;
      padding: 4px 8px;
      white-space: nowrap;
    }

    #nav-link:hover { color: #7eb8f7; border-color: #7eb8f7; }

    #time-box {
      margin: 0 auto;
      border: 1px solid #1e3050;
      padding: 5px 18px;
      text-align: center;
    }

    #time-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #4a6a90;
      margin-bottom: 2px;
    }

    #current-time {
      font-size: 13px;
      color: #7eb8f7;
      letter-spacing: 0.05em;
    }

    #interval-box { display: flex; align-items: center; gap: 8px; }

    #interval-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a6a90;
    }

    #poll-interval {
      background: rgba(13,18,32,0.9);
      color: #c8d8f0;
      border: 1px solid #2a4060;
      border-radius: 3px;
      padding: 4px 8px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    #poll-interval:focus { outline: 1px solid #7eb8f7; }

    #status { font-size: 11px; color: #4a6a90; }
    #status.ok::before  { content: "● "; color: #3ddc84; }
    #status.err::before { content: "● "; color: #e05555; }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 180px;
      flex-shrink: 0;
      border-right: 1px solid rgba(30,48,80,0.8);
      background: rgba(10,14,26,0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #earth-box {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(30,48,80,0.8);
      cursor: pointer;
      flex-shrink: 0;
    }

    #earth-box .body-item { color: #7eb8f7; font-weight: bold; }
    #earth-box .body-item.selected { color: #3ddc84; }

    #filter-bar {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(30,48,80,0.8);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #filter-bar label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #4a6a90;
    }

    #type-filter {
      background: rgba(13,18,32,0.9);
      color: #c8d8f0;
      border: 1px solid #2a4060;
      border-radius: 3px;
      padding: 3px 6px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      flex: 1;
      min-width: 0;
    }

    #type-filter:focus { outline: 1px solid #7eb8f7; }

    #body-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    #body-list::-webkit-scrollbar { width: 4px; }
    #body-list::-webkit-scrollbar-track { background: transparent; }
    #body-list::-webkit-scrollbar-thumb { background: #1e3050; border-radius: 2px; }

    #body-list-empty {
      padding: 10px 14px;
      color: #2a4060;
      font-size: 11px;
    }

    .body-item {
      padding: 5px 14px;
      cursor: pointer;
      color: #4a6a90;
      transition: color 0.1s;
      white-space: nowrap;
    }

    .body-item:hover { color: #7eb8b4; }
    .body-item.selected { color: #3ddc84; }

    /* ── Right content area (transparent, passes clicks to canvas) ── */
    #content {
      flex: 1;
      padding: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      pointer-events: none;
    }

    /* ── Detail panel ── */
    #detail-panel {
      width: 260px;
      border: 1px solid rgba(30,48,80,0.8);
      background: rgba(8,12,20,0.92);
      backdrop-filter: blur(4px);
      padding: 16px 20px;
      display: none;
      pointer-events: auto;
    }

    #detail-name {
      font-size: 17px;
      color: #3ddc84;
      text-align: center;
      margin-bottom: 14px;
      letter-spacing: 0.1em;
    }

    .section-title {
      font-size: 11px;
      color: #3ddc84;
      letter-spacing: 0.08em;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 2px 0;
    }

    .field-label { font-size: 11px; color: #2a7a50; letter-spacing: 0.04em; }
    .field-value { font-size: 11px; color: #3ddc84; font-variant-numeric: tabular-nums; margin-left: 8px; }

    /* ── 3D body labels (rendered by CSS2DRenderer) ── */
    .body-label {
      font-family: "Courier New", monospace;
      font-size: 11px;
      color: rgba(80,120,160,0.9);
      pointer-events: auto;
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
      transform: translate(-50%, calc(-100% - 14px));
    }

    .body-label.lbl-selected { color: #3ddc84; }

    /* ── Body position markers (constant screen size) ── */
    .body-marker {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid rgba(85,136,187,0.75);
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
    }

    .body-marker.marker-selected { border-color: #3ddc84; border-width: 2px; }
  </style>
</head>
<body>

  <div id="canvas-wrap"></div>

  <div id="ui">
    <header>
      <h1>Keplerian Telemetry</h1>
      <a id="nav-link" href="index.html">◂ Solar System View</a>
      <div id="time-box">
        <div id="time-label">Current Time</div>
        <div id="current-time">—</div>
      </div>
      <div id="interval-box">
        <span id="interval-label">Interval</span>
        <select id="poll-interval">
          <option value="1000">1 sec</option>
          <option value="3000">3 sec</option>
          <option value="5000">5 sec</option>
          <option value="10000" selected>10 sec</option>
        </select>
      </div>
      <div id="status">Connecting…</div>
    </header>

    <div class="layout">
      <div id="sidebar">
        <div id="earth-box">
          <div class="body-item" id="earth-item">EARTH</div>
        </div>
        <div id="filter-bar">
          <label for="type-filter">Type</label>
          <select id="type-filter"><option value="">All</option></select>
        </div>
        <div id="body-list"></div>
      </div>

      <div id="content">
        <div id="detail-panel">
          <div id="detail-name"></div>
          <div class="section-title">Keplerian Elements</div>
          <div class="field-row"><span class="field-label">Epoch</span><span class="field-value" id="d-epoch">—</span></div>
          <div class="field-row"><span class="field-label">SMA</span><span class="field-value" id="d-sma">—</span></div>
          <div class="field-row"><span class="field-label">ECC</span><span class="field-value" id="d-ecc">—</span></div>
          <div class="field-row"><span class="field-label">INC  (°)</span><span class="field-value" id="d-inc">—</span></div>
          <div class="field-row"><span class="field-label">RAAN (°)</span><span class="field-value" id="d-raan">—</span></div>
          <div class="field-row"><span class="field-label">ARGP (°)</span><span class="field-value" id="d-argp">—</span></div>
          <div class="field-row"><span class="field-label">MA   (°)</span><span class="field-value" id="d-ma">—</span></div>
          <div class="section-title">Cartesian Elements (Earth-relative)</div>
          <div class="field-row"><span class="field-label">POS X</span><span class="field-value" id="d-px">—</span></div>
          <div class="field-row"><span class="field-label">POS Y</span><span class="field-value" id="d-py">—</span></div>
          <div class="field-row"><span class="field-label">POS Z</span><span class="field-value" id="d-pz">—</span></div>
          <div class="field-row"><span class="field-label">VEL X</span><span class="field-value" id="d-vx">—</span></div>
          <div class="field-row"><span class="field-label">VEL Y</span><span class="field-value" id="d-vy">—</span></div>
          <div class="field-row"><span class="field-label">VEL Z</span><span class="field-value" id="d-vz">—</span></div>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    // ── Constants ─────────────────────────────────────────────────────────────
    // Earth-centered view: 1 Three.js unit = 1000 km, so LEO/GEO orbits are
    // legible instead of collapsing into a point next to Earth (as they would
    // at the solar-system view's 1-unit-per-AU scale).
    const KM     = 1000;           // 1 km in meters
    const SCALE  = 1.0 / (1000 * KM); // Three.js units per meter (1 unit = 1000 km)
    const EARTH_RADIUS_FALLBACK = 6371000; // meters, used until telemetry arrives
    const EARTH_ID = 4; // Fixed object ID for Earth in the KSD object model
    const HIDDEN_TYPES = new Set(['spacecenter']); // ground sites, not orbiting spacecraft
    const GM_EARTH = 3.986004418e14; // Earth standard gravitational parameter, m^3/s^2

    // ── Renderer setup ────────────────────────────────────────────────────────
    const container = document.getElementById('canvas-wrap');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x00000a, 1);
    container.appendChild(renderer.domElement);

    // CSS2D renderer for sharp text labels
    const labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(window.innerWidth, window.innerHeight);
    labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
    container.appendChild(labelRenderer.domElement);

    // ── Scene / Camera / Controls ─────────────────────────────────────────────
    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.0005, 2000);
    camera.position.set(0, 14, 20);
    camera.lookAt(0, 0, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance   = EARTH_RADIUS_FALLBACK * SCALE * 1.05;
    controls.maxDistance   = 500;

    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    // ── Stars ─────────────────────────────────────────────────────────────────
    {
      const n   = 4000;
      const pos = new Float32Array(n * 3);
      for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 600;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, sizeAttenuation: true })));
    }

    // ── Scene groups ──────────────────────────────────────────────────────────
    const orbitGroup = new THREE.Group();
    const bodyGroup  = new THREE.Group();
    scene.add(orbitGroup, bodyGroup);

    function clearGroup(g) {
      g.traverse(child => {
        if (child.isCSS2DObject && child.element.parentNode) {
          child.element.parentNode.removeChild(child.element);
        }
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          (Array.isArray(child.material) ? child.material : [child.material]).forEach(m => m.dispose());
        }
      });
      while (g.children.length) g.remove(g.children[0]);
    }

    // ── Coordinate conversion: Unreal Engine → Three.js ─────────────────────
    // Unreal Engine: left-handed, Z-up (X=forward, Y=right, Z=up)
    // Step 1: negate Y to convert left-handed → right-handed (Z-up)
    // Step 2: Z-up → Y-up for Three.js:  (x, -y, z) → THREE(x, z, y)
    function toThree(x, y, z) {
      return new THREE.Vector3(x * SCALE, z * SCALE, y * SCALE);
    }

    // ICRF right-handed Z-up → Three.js (used internally by kepOrbitPoints)
    function icrfToThree(x, y, z) {
      return new THREE.Vector3(x * SCALE, z * SCALE, -y * SCALE);
    }

    // ── Keplerian orbit → array of Three.js points, centered on the focus ────
    // (Earth). Orbital elements describe the orbit relative to the parent
    // body, so with no offset the resulting points are already Earth-relative.
    // Rotation: perifocal (P,Q,W) → ICRF via R3(−Ω)·R1(−i)·R3(−ω)
    function kepOrbitPoints(kep, nPts = 200) {
      const { a, e, i, raan, argp } = kep;
      if (a == null || a <= 0)          return null;
      if (e == null || e < 0 || e >= 1) return null;
      if (i == null || raan == null || argp == null) return null;

      const d2r = Math.PI / 180;
      const ci = Math.cos(i    * d2r), si = Math.sin(i    * d2r);
      const cO = Math.cos(raan * d2r), sO = Math.sin(raan * d2r);
      const cw = Math.cos(argp * d2r), sw = Math.sin(argp * d2r);

      // P-column (toward periapsis) and Q-column (90° ahead) of the DCM
      const Px = cO*cw - sO*sw*ci,  Py = sO*cw + cO*sw*ci,  Pz = sw*si;
      const Qx = -cO*sw - sO*cw*ci, Qy = -sO*sw + cO*cw*ci, Qz = cw*si;

      const b = a * Math.sqrt(1 - e * e);

      const pts = [];
      for (let k = 0; k < nPts; k++) {
        const E  = (2 * Math.PI * k) / nPts;
        const xp = a * (Math.cos(E) - e);
        const yp = b * Math.sin(E);
        pts.push(icrfToThree(Px*xp + Qx*yp, Py*xp + Qy*yp, Pz*xp + Qz*yp));
      }
      return pts;
    }

    // ── Cartesian state (Earth-relative) → Keplerian elements ────────────────
    // The server's own `kep` field is expressed in Earth's tilted equatorial
    // reference frame (KSD applies an axial-tilt rotation on top of it before
    // it ever reaches this client), so it doesn't line up with `cart.pos`,
    // which is already in the same world frame the markers are drawn in. To
    // keep the orbit line glued to the marker regardless of that, derive the
    // ellipse directly from the object's own relative position/velocity
    // instead of trusting the server's kep values.
    // r, v must be in the right-handed frame kepOrbitPoints() expects, i.e.
    // Unreal (x, y, z) with y negated — see toThree()/icrfToThree() above.
    function cartesianToKepElements(r, v, gm) {
      const rMag = Math.hypot(r.x, r.y, r.z);
      const vMag = Math.hypot(v.x, v.y, v.z);
      if (rMag <= 0 || gm <= 0) return null;

      const h = { // specific angular momentum: r × v
        x: r.y * v.z - r.z * v.y,
        y: r.z * v.x - r.x * v.z,
        z: r.x * v.y - r.y * v.x
      };
      const hMag = Math.hypot(h.x, h.y, h.z);
      if (hMag <= 0) return null;

      const n = { x: -h.y, y: h.x }; // node vector: ẑ × h (z-component is always 0)
      const nMag = Math.hypot(n.x, n.y);

      const rDotV  = r.x * v.x + r.y * v.y + r.z * v.z;
      const coeff  = vMag * vMag - gm / rMag;
      const eVec   = {
        x: (coeff * r.x - rDotV * v.x) / gm,
        y: (coeff * r.y - rDotV * v.y) / gm,
        z: (coeff * r.z - rDotV * v.z) / gm
      };
      const e = Math.hypot(eVec.x, eVec.y, eVec.z);

      const energy = (vMag * vMag) / 2 - gm / rMag;
      if (energy >= 0 || e >= 1) return null; // only closed (elliptical) orbits are drawn
      const a = -gm / (2 * energy);

      const r2d   = 180 / Math.PI;
      const clamp = (x) => Math.min(1, Math.max(-1, x));
      const i     = Math.acos(clamp(h.z / hMag)) * r2d;

      let raan = nMag > 1e-6 ? Math.atan2(n.y, n.x) * r2d : 0;
      if (raan < 0) raan += 360;

      let argp = 0;
      if (nMag > 1e-6 && e > 1e-6) {
        argp = Math.acos(clamp((n.x * eVec.x + n.y * eVec.y) / (nMag * e))) * r2d;
        if (eVec.z < 0) argp = 360 - argp;
      }

      return { a, e, i, raan, argp };
    }

    // ── Earth mesh (persistent; only its radius changes as telemetry arrives) ─
    let earthMesh   = null;
    let earthRadius = EARTH_RADIUS_FALLBACK;

    function ensureEarthMesh(radiusMeters) {
      const r = (radiusMeters != null && radiusMeters > 0) ? radiusMeters : EARTH_RADIUS_FALLBACK;
      if (earthMesh && r === earthRadius) return;
      earthRadius = r;

      if (earthMesh) {
        scene.remove(earthMesh);
        earthMesh.traverse(c => {
          if (c.geometry) c.geometry.dispose();
          if (c.material) c.material.dispose();
        });
      }

      const physRadius = r * SCALE;
      earthMesh = new THREE.Group();
      earthMesh.add(new THREE.Mesh(
        new THREE.SphereGeometry(physRadius, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x2255aa })
      ));
      // Atmosphere glow layers
      [[1.02, 0.18], [1.08, 0.08], [1.18, 0.03]].forEach(([mult, op]) => {
        earthMesh.add(new THREE.Mesh(
          new THREE.SphereGeometry(physRadius * mult, 24, 24),
          new THREE.MeshBasicMaterial({ color: 0x7eb8f7, transparent: true, opacity: op })
        ));
      });
      earthMesh.userData.objectId = EARTH_MARKER_ID;
      scene.add(earthMesh);
    }

    // ── Scene update ──────────────────────────────────────────────────────────
    const EARTH_MARKER_ID = '__earth__';
    let craftMeshes = {};

    function selectObject(id) {
      selectedId = id;
      focusOn(id);
      renderList();
      showDetail();
      updateScene();
    }

    function updateScene() {
      clearGroup(orbitGroup);
      clearGroup(bodyGroup);
      craftMeshes = {};

      if (!earthObj) return;

      ensureEarthMesh(earthObj.radius);

      const ePos = earthObj.cart?.pos;

      spacecraft.forEach(o => {
        const isSelected = o.id === selectedId;

        // ── Relative position marker ──
        if (o.cart?.pos && ePos) {
          const relX = o.cart.pos.x - ePos.x;
          const relY = o.cart.pos.y - ePos.y;
          const relZ = o.cart.pos.z - ePos.z;
          const pos3 = toThree(relX, relY, relZ);

          const physRadius = (o.radius != null && o.radius > 0) ? o.radius * SCALE : 0;
          const markerR = isSelected ? 0.6 : 0.4;
          const color = isSelected ? 0x3ddc84 : 0x5588bb;

          const craftObj = new THREE.Group();
          craftObj.position.copy(pos3);
          craftObj.userData.objectId = o.id;

          if (physRadius > 0) {
            craftObj.add(new THREE.Mesh(
              new THREE.SphereGeometry(physRadius, 8, 8),
              new THREE.MeshBasicMaterial({ color })
            ));
          }

          const hitSphere = new THREE.Mesh(
            new THREE.SphereGeometry(markerR, 8, 8),
            new THREE.MeshBasicMaterial({ visible: false })
          );
          craftObj.add(hitSphere);

          const markerWrapper = document.createElement('div');
          markerWrapper.style.pointerEvents = 'none';
          const markerDiv = document.createElement('div');
          markerDiv.className = 'body-marker' + (isSelected ? ' marker-selected' : '');
          markerDiv.addEventListener('click', e => { e.stopPropagation(); selectObject(o.id); });
          markerWrapper.appendChild(markerDiv);
          const markerObj = new CSS2DObject(markerWrapper);
          markerObj.position.set(0, 0, 0);
          craftObj.add(markerObj);

          const labelWrapper = document.createElement('div');
          labelWrapper.style.pointerEvents = 'none';
          const div = document.createElement('div');
          div.className = 'body-label' + (isSelected ? ' lbl-selected' : '');
          div.textContent = o.name ?? String(o.id);
          div.addEventListener('click', e => { e.stopPropagation(); selectObject(o.id); });
          labelWrapper.appendChild(div);
          const lbl = new CSS2DObject(labelWrapper);
          lbl.position.set(0, 0, 0);
          craftObj.add(lbl);

          bodyGroup.add(craftObj);
          craftMeshes[o.id] = craftObj;
        }

        // ── Orbit line, derived from this object's own state relative to Earth ──
        // Note: unlike cart.pos (heliocentric absolute, needs the Earth offset
        // subtracted), cart.vel for a child of Earth is sent already relative
        // to Earth — confirmed empirically: subtracting Earth's own velocity
        // from e.g. ISS's raw vel gives ~27 km/s (nonsense for LEO), while
        // using ISS's raw vel as-is gives ~7.65 km/s (correct).
        if (o.cart?.pos && o.cart?.vel && ePos) {
          const r = { x: o.cart.pos.x - ePos.x, y: -(o.cart.pos.y - ePos.y), z: o.cart.pos.z - ePos.z };
          const v = { x: o.cart.vel.x, y: -o.cart.vel.y, z: o.cart.vel.z };
          const kep = cartesianToKepElements(r, v, GM_EARTH);
          let pts = kep && kepOrbitPoints(kep);
          if (!pts) {
            const rMag = Math.hypot(r.x, r.y, r.z);
            const vMag = Math.hypot(v.x, v.y, v.z);
            const energy = (vMag * vMag) / 2 - GM_EARTH / rMag;
            console.warn(
              `[earth.html] derived kep failed for ${o.name ?? o.id}: ` +
              `|r|=${rMag.toExponential(4)} m  |v|=${vMag.toExponential(4)} m/s  ` +
              `energy=${energy.toExponential(4)}  kep=${JSON.stringify(kep)}  ` +
              `raw pos=${JSON.stringify(o.cart.pos)} earthPos=${JSON.stringify(ePos)} ` +
              `raw vel=${JSON.stringify(o.cart.vel)} ` +
              `serverKep=${JSON.stringify(o.kep)}`
            );
            pts = o.kep && kepOrbitPoints(o.kep);
          }
          if (pts) {
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            orbitGroup.add(new THREE.LineLoop(geo, new THREE.LineBasicMaterial({
              color:       isSelected ? 0x3ddc84 : 0x1a3555,
              transparent: true,
              opacity:     isSelected ? 0.9 : 0.6
            })));
          }
        }
      });
    }

    // ── Raycasting: click on body sphere ──────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    let pointerDownPos = null;

    renderer.domElement.addEventListener('pointerdown', e => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('click', e => {
      if (!pointerDownPos) return;
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      if (dx * dx + dy * dy > 25) return; // ignore drag (> 5px)

      const rect  = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );
      raycaster.setFromCamera(mouse, camera);

      const hitTargets = [...bodyGroup.children];
      if (earthMesh) hitTargets.push(earthMesh);
      const hits = raycaster.intersectObjects(hitTargets, true);
      if (hits.length > 0) {
        let node = hits[0].object;
        while (node && node.userData.objectId == null) node = node.parent;
        const id = node?.userData.objectId;
        if (id != null) selectObject(id);
      }
    });

    // ── Focus animation ───────────────────────────────────────────────────────
    let targetGoal = null;

    function focusOn(id) {
      if (id === EARTH_MARKER_ID) {
        targetGoal = new THREE.Vector3(0, 0, 0);
        controls.minDistance = earthRadius * SCALE * 1.05;
        return;
      }
      const obj = spacecraft.find(o => o.id === id);
      const ePos = earthObj?.cart?.pos;
      if (!obj?.cart?.pos || !ePos) return;
      targetGoal = toThree(obj.cart.pos.x - ePos.x, obj.cart.pos.y - ePos.y, obj.cart.pos.z - ePos.z);
      controls.minDistance = (obj.radius != null && obj.radius > 0)
        ? obj.radius * 2 * SCALE
        : 0.02;
    }

    // ── Animation loop ────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      if (targetGoal) {
        controls.target.lerp(targetGoal, 0.08);
        if (controls.target.distanceTo(targetGoal) < 0.0001) {
          controls.target.copy(targetGoal);
          targetGoal = null;
        }
      }
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    }
    animate();

    // ── UI logic ──────────────────────────────────────────────────────────────
    const statusEl       = document.getElementById("status");
    const currentTimeEl  = document.getElementById("current-time");
    const bodyListEl     = document.getElementById("body-list");
    const typeFilterEl   = document.getElementById("type-filter");
    const pollIntervalEl = document.getElementById("poll-interval");
    const detailPanelEl  = document.getElementById("detail-panel");
    const earthItemEl    = document.getElementById("earth-item");

    let timerId    = null;
    let earthObj   = null;   // the Earth SpaceObject, or null until telemetry arrives
    let spacecraft = [];     // objects whose parentId === earthObj.id
    let selectedId = null;   // number (spacecraft id) or EARTH_MARKER_ID

    function fmtNum(n, d) { return n == null ? "—" : Number(n).toFixed(d); }
    function fmtEpoch(ep) {
      if (ep == null) return "—";
      return new Date(ep * 1000).toISOString().replace("T", " ").slice(0, 19);
    }

    function updateTypeOptions() {
      const cur   = typeFilterEl.value;
      const types = [...new Set(spacecraft.map(o => o.type).filter(Boolean))].sort();
      typeFilterEl.innerHTML = '<option value="">All</option>' +
        types.map(t => `<option${t === cur ? " selected" : ""} value="${t}">${t}</option>`).join("");
    }

    function getFiltered() {
      const s = typeFilterEl.value;
      return s ? spacecraft.filter(o => o.type === s) : spacecraft;
    }

    function renderList() {
      earthItemEl.className = "body-item" + (selectedId === EARTH_MARKER_ID ? " selected" : "");
      earthItemEl.onclick = () => selectObject(EARTH_MARKER_ID);

      const list = getFiltered();
      if (list.length === 0) {
        bodyListEl.innerHTML = '<div id="body-list-empty">No orbiting spacecraft</div>';
        return;
      }
      bodyListEl.innerHTML = list.map(o => {
        const cls = o.id === selectedId ? " selected" : "";
        return `<div class="body-item${cls}" data-id="${o.id}">${o.name ?? o.id}</div>`;
      }).join("");
      bodyListEl.querySelectorAll(".body-item").forEach(el => {
        el.addEventListener("click", () => selectObject(Number(el.dataset.id)));
      });
    }

    function showDetail() {
      if (selectedId === EARTH_MARKER_ID && earthObj) {
        detailPanelEl.style.display = "block";
        document.getElementById("detail-name").textContent = "EARTH";
        document.getElementById("d-epoch").textContent = fmtEpoch(earthObj.kep?.ep);
        document.getElementById("d-sma").textContent   = fmtNum(earthObj.kep?.a,    3);
        document.getElementById("d-ecc").textContent   = fmtNum(earthObj.kep?.e,    7);
        document.getElementById("d-inc").textContent   = fmtNum(earthObj.kep?.i,    4);
        document.getElementById("d-raan").textContent  = fmtNum(earthObj.kep?.raan, 2);
        document.getElementById("d-argp").textContent  = fmtNum(earthObj.kep?.argp, 2);
        document.getElementById("d-ma").textContent    = fmtNum(earthObj.kep?.ma,   2);
        document.getElementById("d-px").textContent    = fmtNum(0, 3);
        document.getElementById("d-py").textContent    = fmtNum(0, 3);
        document.getElementById("d-pz").textContent    = fmtNum(0, 3);
        document.getElementById("d-vx").textContent    = "—";
        document.getElementById("d-vy").textContent    = "—";
        document.getElementById("d-vz").textContent    = "—";
        return;
      }

      const obj = spacecraft.find(o => o.id === selectedId);
      if (!obj) { detailPanelEl.style.display = "none"; return; }
      const ePos = earthObj?.cart?.pos;
      detailPanelEl.style.display = "block";
      document.getElementById("detail-name").textContent = obj.name ?? obj.id;
      document.getElementById("d-epoch").textContent = fmtEpoch(obj.kep?.ep);
      document.getElementById("d-sma").textContent   = fmtNum(obj.kep?.a,    3);
      document.getElementById("d-ecc").textContent   = fmtNum(obj.kep?.e,    7);
      document.getElementById("d-inc").textContent   = fmtNum(obj.kep?.i,    4);
      document.getElementById("d-raan").textContent  = fmtNum(obj.kep?.raan, 2);
      document.getElementById("d-argp").textContent  = fmtNum(obj.kep?.argp, 2);
      document.getElementById("d-ma").textContent    = fmtNum(obj.kep?.ma,   2);
      document.getElementById("d-px").textContent    = fmtNum(obj.cart?.pos && ePos ? obj.cart.pos.x - ePos.x : null, 3);
      document.getElementById("d-py").textContent    = fmtNum(obj.cart?.pos && ePos ? obj.cart.pos.y - ePos.y : null, 3);
      document.getElementById("d-pz").textContent    = fmtNum(obj.cart?.pos && ePos ? obj.cart.pos.z - ePos.z : null, 3);
      document.getElementById("d-vx").textContent    = fmtNum(obj.cart?.vel?.x, 9);
      document.getElementById("d-vy").textContent    = fmtNum(obj.cart?.vel?.y, 9);
      document.getElementById("d-vz").textContent    = fmtNum(obj.cart?.vel?.z, 9);
    }

    function render(data) {
      const objects = (data.objects ?? []).slice().sort((a, b) => a.id - b.id);
      if (data.currentTime != null) {
        currentTimeEl.textContent = new Date(data.currentTime * 1000)
          .toISOString().replace("T", " ").slice(0, 19) + " UTC";
      }

      earthObj = objects.find(o => o.id === EARTH_ID) ?? null;
      spacecraft = earthObj
        ? objects.filter(o => o.parentId === earthObj.id && !HIDDEN_TYPES.has((o.type ?? "").trim().toLowerCase()))
        : [];

      if (earthObj && selectedId == null) selectedId = EARTH_MARKER_ID;
      if (selectedId !== EARTH_MARKER_ID && !spacecraft.some(o => o.id === selectedId)) {
        selectedId = earthObj ? EARTH_MARKER_ID : null;
      }

      updateTypeOptions();
      renderList();
      showDetail();
      updateScene();
    }

    typeFilterEl.addEventListener("change", () => { renderList(); updateScene(); });

    async function poll() {
      try {
        const res  = await fetch("/api/objects");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        render(data);
        statusEl.className   = "ok";
        statusEl.textContent = earthObj ? "Live" : "Live (waiting for Earth)";
      } catch (e) {
        statusEl.className   = "err";
        statusEl.textContent = e.message;
      }
    }

    function startPolling() {
      if (timerId !== null) clearInterval(timerId);
      timerId = setInterval(poll, Number(pollIntervalEl.value));
    }

    pollIntervalEl.addEventListener("change", startPolling);

    poll();
    startPolling();
  </script>
</body>
</html>
